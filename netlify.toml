[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# URL courte pour l'assistant d'equilibrage hydraulique
[[redirects]]
  from = "/equilibrage"
  to = "/shades_equilibrage.html"
  status = 200
