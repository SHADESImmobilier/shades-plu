/* ---------- lancement de l'assistant ---------- */
function startWiz(gid){
  const par=noeud(gid);
  const membres=membresGroupe(gid).filter(n=>n.valve);
  if(!membres.length){ flash("Aucun organe de réglage dans ce groupe",true); return; }
  const cats=[...new Set(membres.map(n=>VALVES.find(v=>v.id===n.valve.id).cat))];
  const dyn = cats.every(c=>["limiteur","picv","dpcv"].includes(c));
  const sansPrise = cats.every(c=>c==="fixe");
  openModal(`<div class="modal-h"><div><h3>Équilibrer « ${esc(par.nom)} »</h3>
     <small style="color:var(--faint)">${membres.length} organe(s) de réglage</small></div>
     <button class="iconbtn" onclick="closeModal()">✕</button></div>
   ${dyn?'<div class="note i">Ce groupe ne comporte que des <b>organes dynamiques</b> (limiteurs, PICV, DPCV). La méthode proportionnelle ne s\'appliqué pas : l\'assistant va vérifier les réglages et les dp disponibles.</div>':""}
   ${!dyn && cats.some(c=>["limiteur","picv","dpcv"].includes(c))?'<div class="note d"><b>Groupe mixte</b> : il contient à la fois des organes statiques et des organes dynamiques (limiteur, PICV ou DPCV). Un organe dynamique <b>ne doit pas</b> être inclus dans une méthode proportionnelle : il maintient son débit et fausserait le calcul des rapports L. Traitez-le séparément avec la vérification dynamique, ou sortez-le du groupe.</div>':""}
   ${sansPrise?'<div class="note d">Aucun organe de ce groupe ne dispose de prises de pression. Vous aurez besoin d\'un <b>débitmètre à ultrasons</b>, ou vous devrez procéder par température.</div>':""}
   <div class="grid">
     ${!dyn?`<button class="btn wide pri" data-m="prop">Méthode proportionnelle · 1 appareil, 1 opérateur</button>`:""}
     ${!dyn?`<button class="btn wide" data-m="comp">Méthode compensée · 2 appareils / 2 opérateurs</button>`:""}
     ${dyn?`<button class="btn wide pri" data-m="dyn">Vérification des organes dynamiques</button>`:""}
     <button class="btn wide" data-m="pre">Préréglage par le calcul (sans mesure)</button>
   </div>`);
  $$("[data-m]").forEach(b=>b.onclick=()=>{
    WIZ={ gid:gid, methode:b.dataset.m, stage:"prep", idx:0,
          ordre:membres.map(n=>n.id), refId:null, lamRef:null, log:[] };
    closeModal(); go("equilibrage");
  });
}
function wizMembres(){ return WIZ.ordre.map(id=>noeud(id)).filter(Boolean); }
function wizPar(){ return noeud(WIZ.gid); }

/* ---------- rendu de l'assistant ---------- */
function renderWiz(){
  const el=$("#v-equilibrage");
  const par=wizPar(); const ms=wizMembres();
  const M={prop:"Méthode proportionnelle",comp:"Méthode compensée",dyn:"Vérification dynamique",pre:"Préréglage calculé"}[WIZ.methode];
  let body="", bar="", stepInfo={n:1,tot:5};

  if(WIZ.stage==="prep")      ({body,bar,stepInfo}=wizPrep(par,ms));
  else if(WIZ.stage==="open") ({body,bar,stepInfo}=wizOpen(par,ms));
  else if(WIZ.stage==="mes0") ({body,bar,stepInfo}=wizMes0(par,ms));
  else if(WIZ.stage==="ref")  ({body,bar,stepInfo}=wizRef(par,ms));
  else if(WIZ.stage==="regl") ({body,bar,stepInfo}=wizRegl(par,ms));
  else if(WIZ.stage==="comp") ({body,bar,stepInfo}=wizComp(par,ms));
  else if(WIZ.stage==="dyn")  ({body,bar,stepInfo}=wizDyn(par,ms));
  else if(WIZ.stage==="pre")  ({body,bar,stepInfo}=wizPre(par,ms));
  else if(WIZ.stage==="fin")  ({body,bar,stepInfo}=wizFin(par,ms));

  el.innerHTML=`
   <div class="card tight noprint">
     <div class="spread"><div style="min-width:0">
       <b style="font-size:13px">${TYPES[par.type].ic} ${esc(par.nom)}</b>
       <div style="font-size:11px;color:var(--faint)">${esc(M)} · ${chemin(par.id).map(x=>esc(x.nom)).join(" › ")}</div>
     </div><button class="btn xs dgr" id="wizQuit">Quitter</button></div>
     <div class="steps" style="margin-top:10px">${Array.from({length:stepInfo.tot},(_,i)=>
       `<div class="stepdot ${i+1<stepInfo.n?"done":i+1===stepInfo.n?"cur":""}"></div>`).join("")}</div>
   </div>
   ${body}`;
  $("#wizQuit").onclick=()=>{ if(confirm("Quitter l'assistant ? Les mesures déjà saisies sont conservées.")){ WIZ=null; go("equilibrage"); } };
  $("#wizbar").style.display="block";
  $("#wizbarIn").innerHTML='<button class="btn" id="wizIA" style="flex:0 0 46px;border-color:rgba(224,165,61,.45);background:var(--amberdim)" title="Demander conseil à l\'assistant IA">✨</button>'+bar;
  $("#wizIA").onclick=()=>aiDemander(wizQuestion(), "execution");
  if(typeof window.__wizBind==="function") window.__wizBind();
}
function wizGo(stage, idx){ WIZ.stage=stage; if(idx!=null) WIZ.idx=idx; autosave(); renderWiz(); }
/* Question pre-remplie pour l'assistant IA, adaptee a l'etape en cours */
function wizQuestion(){
  if(!WIZ) return "Par où dois-je commencer sur ce chantier ?";
  const par=wizPar(), ms=wizMembres();
  const n = (WIZ.stage==="regl" && WIZ.file) ? noeud(WIZ.file[WIZ.idx]) : ms[WIZ.idx];
  const nom = n? n.nom : "cet organe";
  const q={
    prep:"Je vais équilibrer le groupe « "+par.nom+" ». Vérifie avec moi que tout est prêt et dis-moi ce que je dois contrôler avant de commencer.",
    open:"J'ouvre toutes les vannes du groupe « "+par.nom+" ». Comment m'assurer qu'une vanne est bien grande ouverte quand elle n'a pas d'affichage de position ?",
    mes0:"Je relève le débit de « "+nom+" ». Ma mesure te paraît-elle cohérente, et que dois-je vérifier avant de la valider ?",
    ref:"Analyse les rapports L du groupe « "+par.nom+" » : la référence retenue est-elle la bonne, et la dispersion est-elle normale ?",
    regl:"Je dois régler la vanne de « "+nom+" » dans le groupe « "+par.nom+" ». Guide-moi geste par geste et dis-moi de combien fermer.",
    comp:"Méthode compensée sur « "+par.nom+" », organe « "+nom+" ». Rappelle-moi précisément le rôle de chaque opérateur à cette étape.",
    dyn:"Vérification d'un organe dynamique sur « "+nom+" ». Que dois-je contrôler exactement, et que faire si le dp disponible est insuffisant ?",
    pre:"Je fais un préréglage calculé sur « "+par.nom+" ». Le dp que j'ai retenu est-il réaliste, et quels circuits dois-je ensuite contrôler à la mesure ?",
    fin:"Analyse le résultat de l'équilibrage du groupe « "+par.nom+" » : est-ce acceptable, que reste-t-il à faire, et quelles réserves dois-je noter au PV ?"
  }[WIZ.stage];
  return q || ("Aide-moi sur le groupe « "+par.nom+" ».");
}

/* --- ÉTAPE 1 : preparation --- */
function wizPrep(par,ms){
  window.__wizBind=()=>{
    $$("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ const a=WIZ.ordre.splice(i,1)[0]; WIZ.ordre.splice(i-1,0,a); renderWiz(); }});
    $$("[data-dn2]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn2; if(i<WIZ.ordre.length-1){ const a=WIZ.ordre.splice(i,1)[0]; WIZ.ordre.splice(i+1,0,a); renderWiz(); }});
    $("#wNext").onclick=()=>wizGo(WIZ.methode==="pre"?"pre":WIZ.methode==="dyn"?"dyn":"open");
    $("#wBack").onclick=()=>{ WIZ=null; go("equilibrage"); };
  };
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">1</div><div>
      <h2>Préparer l'intervention</h2>
      <p>Vérifier le matériel, repérer les vannes et fixer l'ordre hydraulique du groupe.</p></div></div>
    <div class="act"><b>A faire maintenant</b><p>Repérez physiquement chaque organe de réglage de ce groupe et collez une étiquette avec son repère. Vous allez revenir plusieurs fois sur les mêmes vannes : sans repérage, l'erreur est garantie.</p></div>
    <h3>Ordre hydraulique</h3>
    <p class="sub">Classez du <b>plus proche</b> de la pompe (en haut) au <b>plus éloigné</b> (en bas). Cet ordre sert à la méthode compensée et aux conseils de réglage.</p>
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Organe</th><th>Vanne</th><th class="num">Débit nominal</th><th></th></tr></thead><tbody>
    ${ms.map((n,i)=>{ const v=VALVES.find(x=>x.id===n.valve.id); return `<tr>
      <td class="mono">${i+1}</td><td>${esc(n.nom)}</td>
      <td style="font-size:11.5px;color:var(--muted)">${esc(v.marque)} ${esc(v.modele)} DN${n.valve.dn||"?"}</td>
      <td class="num mono">${fx(debitNominal(n),0)} l/h</td>
      <td style="white-space:nowrap"><button class="btn xs" data-up="${i}">↑</button> <button class="btn xs" data-dn2="${i}">↓</button></td></tr>`;}).join("")}
    </tbody></table></div>
    ${ms.some(n=>!(debitNominal(n)>0))? '<div class="note d">Certains organes n\'ont <b>pas de débit nominal</b>. Sans consigne, aucun équilibrage n\'est possible : renseignez-les dans l\'onglet Débits.</div>':""}
    <h3>Rappel des conditions de mesure</h3>
    <ul class="bul">
      <li>Pompe figée en vitesse fixe, régulation forcée en ouverture totale.</li>
      <li>Têtes thermostatiques déposées ou bloquées au maxi.</li>
      <li>Flexibles de l'appareil purges, zéro refait sur site.</li>
      <li>Réseau à température de service et débits stabilisés.</li>
    </ul>
    ${P.instrument? ficheInstrument(INSTRUMENTS.find(i=>i.id===P.instrument)) : '<div class="note">Aucun appareil de mesure déclaré (onglet Chantier).</div>'}
  </div>`;
  return {body, bar:`<button class="btn" id="wBack">Annuler</button><button class="btn pri" id="wNext">Commencer →</button>`, stepInfo:{n:1,tot:WIZ.methode==="prop"?6:4}};
}

/* --- ÉTAPE 2 : ouverture totale --- */
function wizOpen(par,ms){
  window.__wizBind=()=>{
    $$("[data-op]").forEach(c=>c.onchange=()=>{ const n=noeud(c.dataset.op); n.ouvert=c.checked; autosave(); maj(); });
    $("#wNext").onclick=()=>wizGo(WIZ.methode==="comp"?"comp":"mes0",0);
    $("#wBack").onclick=()=>wizGo("prep");
    maj();
    function maj(){ const d=ms.filter(n=>n.ouvert).length;
      const b=$("#wNext"); if(b){ b.disabled=false; b.textContent = d===ms.length? "Toutes ouvertes → mesurer" : "Continuer ("+d+"/"+ms.length+") →"; } }
  };
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">2</div><div>
      <h2>Ouvrir toutes les vannes du groupe</h2>
      <p>Point de départ obligatoire : le réseau doit être en configuration "tout ouvert" pour révéler le déséquilibre réel.</p></div></div>
    <div class="act"><b>Geste précis</b><p>Ouvrir chaque vanne <b>à fond</b>, en comptant les tours si la vanne n'a pas d'affichage. Ne jamais forcer en butée : on tourne jusqu'à la résistance, puis on revient d'un huitième de tour.</p></div>
    <ul class="chk">
      ${ms.map(n=>{ const v=VALVES.find(x=>x.id===n.valve.id); return `<li>
        <input type="checkbox" data-op="${n.id}"${n.ouvert?" checked":""}>
        <div><b>${esc(n.nom)}</b> — ${esc(v.marque)} ${esc(v.modele)} DN${n.valve.dn||"?"}
        <span class="why">${esc(v.reglage)}</span></div></li>`;}).join("")}
    </ul>
    <div class="note i">Pourquoi ouvrir tout ? Parce que le <b>circuit le plus défavorisé</b> ne se révèle qu'en pleine ouverture. Si vous partez de positions quelconques, vous risquez de désigner une mauvaise référence et de tourner en rond pendant des heures.</div>
  </div>`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn pri" id="wNext">Continuer →</button>`, stepInfo:{n:2,tot:WIZ.methode==="prop"?6:4}};
}

/* --- bloc de saisie d'une mesure (réutilisé partout) --- */
function mesureBlocHTML(n, cible){
  const v=VALVES.find(x=>x.id===n.valve.id);
  const ch=chartOf(n);
  const last=derniereMesure(n)||{};
  const qn=debitNominal(n);
  return `<div class="card" style="background:var(--bg2)">
    <div class="spread"><b>${esc(n.nom)}</b><span class="tag amber">${esc(v.marque)} ${esc(v.modele)} DN${n.valve.dn||"?"}</span></div>
    <div class="grid g3" style="margin-top:12px">
      <label class="f"><span>Position du volant (${esc(v.posLabel||"tours")})</span><input type="number" step="0.1" id="m_pos" value="${last.pos!=null?last.pos:""}"></label>
      <label class="f"><span>dp mesure (kPa)</span><input type="number" step="0.1" id="m_dp" value="${last.dp!=null?last.dp:""}"></label>
      <label class="f"><span>Débit lu (l/h)</span><input type="number" id="m_q" value="${last.q!=null?Math.round(last.q):""}"></label>
    </div>
    <div class="hint">Renseignez le <b>débit lu sur l'appareil</b> si vous l'avez (c'est le plus sur). ${ch?"Sinon, position + dp suffisent : l'abaque saisi fait le calcul.":"Sinon, position + dp permettent seulement de déduire le Kv : l'appareil de mesure, lui, connaît l'abaque de la vanne."}</div>
    <div id="m_prev"></div>
    ${cible!=null&&cible>0?`<div class="note"><b>Débit visé : ${fx(cible,0)} l/h</b>${qn>0?' · débit nominal '+fx(qn,0)+' l/h':""}</div>`:""}
  </div>`;
}
function mesureBind(n, onChange){
  const v=VALVES.find(x=>x.id===n.valve.id);
  const ch=chartOf(n);
  const upd=()=>{
    const pos = $("#m_pos").value===""? null : +$("#m_pos").value;
    const dp  = $("#m_dp").value===""?  null : +$("#m_dp").value;
    let   q   = $("#m_q").value===""?   null : +$("#m_q").value;
    let kv=null, calc=false;
    if(q==null && ch && pos!=null && dp>0){ kv=kvDepuisPosition(ch,pos); q=debitDepuisKv(kv,dp,P.fluide); calc=true; }
    if(q>0 && dp>0) kv=kvDepuisMesure(q,dp,P.fluide);
    const qn=debitNominal(n);
    const lam = (q>0&&qn>0)? q/qn : null;
    let warn="";
    if(dp!=null && dp<3 && (v.cat==="statique"))
      warn+='<div class="note d">dp = '+fx(dp,1)+' kPa : <b>sous le seuil de fiabilité de 3 kPa</b> sur une vanne statique. Fermez la vanne pour remonter le signal, ou recoupez au débitmètre à ultrasons. Ne validez pas une mesure à 1 kPa comme si elle était exacte.</div>';
    if(dp!=null && dp>30 && v.cat==="statique")
      warn+='<div class="note">dp = '+fx(dp,0)+' kPa aux bornes de la vanne : élevé. Risque de bruit et consommation de pompage inutile. A la fin de l\'équilibrage, pensez à réduire la pompe.</div>';
    if(ch && pos!=null && q>0 && dp>0){
      const kvA=kvDepuisPosition(ch,pos), kvM=kvDepuisMesure(q,dp,P.fluide);
      if(kvA>0 && Math.abs(kvM-kvA)/kvA>0.20)
        warn+='<div class="note d">Écart de plus de 20 % entre le Kv de l\'abaque à cette position ('+fx(kvA,3)+') et le Kv déduit de la mesure ('+fx(kvM,3)+'). Causes probables : <b>bulle d\'air dans un flexible</b>, prises inversées, mauvaise référence de vanne, vanne encrassée, ou position mal relevée. Vérifiez avant de continuer.</div>';
    }
    $("#m_prev").innerHTML=`<div class="grid g3" style="margin-top:6px">
      <div class="kpi ${lam==null?"":Math.abs(lam-1)*100<=(n.type==="terminal"?P.tolTerm:P.tolAnt)?"good":"bad"}">
        <div class="k">Débit ${calc?"calculé":"retenu"}</div><div class="v">${q>0?fx(q,0):"—"}<span class="u"> l/h</span></div></div>
      <div class="kpi"><div class="k">Kv ${kv?"déduit":""}</div><div class="v">${kv?fx(kv,3):"—"}</div></div>
      <div class="kpi hi"><div class="k">Rapport L = Q / Qnom</div><div class="v">${lam!=null?fx(lam,3):"—"}</div></div>
    </div>${warn}`;
    if(onChange) onChange({pos,dp,q,kv,lam});
  };
  ["m_pos","m_dp","m_q"].forEach(id=>{ const e=$("#"+id); if(e) e.oninput=upd; });
  upd();
  return ()=>({ pos: $("#m_pos").value===""?null:+$("#m_pos").value,
                dp:  $("#m_dp").value===""?null:+$("#m_dp").value,
                q:   (()=>{ let q=$("#m_q").value===""?null:+$("#m_q").value;
                            const pos=$("#m_pos").value===""?null:+$("#m_pos").value;
                            const dp=$("#m_dp").value===""?null:+$("#m_dp").value;
                            if(q==null&&ch&&pos!=null&&dp>0) q=debitDepuisKv(kvDepuisPosition(ch,pos),dp,P.fluide);
                            return q; })() });
}
function enregistrerMesure(n, m, phase){
  n.mesures=n.mesures||[];
  n.mesures.push({t:new Date().toISOString(), pos:m.pos, dp:m.dp, q:m.q, phase:phase||""});
  if(m.pos!=null && n.valve) n.valve.pos=m.pos;
  autosave();
}

/* --- ÉTAPE 3 : mesure initiale de chaque organe (méthode proportionnelle) --- */
function wizMes0(par,ms){
  const n=ms[WIZ.idx];
  if(!n){ return wizRef(par,ms); }
  let get=null;
  window.__wizBind=()=>{
    get=mesureBind(n);
    $("#wNext").onclick=()=>{
      const m=get();
      if(!(m.q>0)){ flash("Saisissez le débit (ou position + dp avec un abaque)",true); return; }
      enregistrerMesure(n,m,"initiale");
      if(WIZ.idx<ms.length-1) wizGo("mes0",WIZ.idx+1); else wizGo("ref");
    };
    $("#wBack").onclick=()=>{ if(WIZ.idx>0) wizGo("mes0",WIZ.idx-1); else wizGo("open"); };
    $("#wSkip").onclick=()=>{ if(WIZ.idx<ms.length-1) wizGo("mes0",WIZ.idx+1); else wizGo("ref"); };
  };
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">3</div><div>
      <h2>Relevé initial ${WIZ.idx+1} / ${ms.length}</h2>
      <p>Toutes les vannes grandes ouvertes, on mesure le débit de chaque organe. Aucun réglage à ce stade.</p></div></div>
    <div class="act"><b>Sur place</b><p>Piquez les aiguilles sur les prises de la vanne <b>${esc(n.nom)}</b>, purgez les flexibles, faites le zéro, puis relevez. Attendez que la valeur soit stable pendant au moins 10 secondes avant de la noter.</p></div>
  </div>
  ${mesureBlocHTML(n,null)}
  <div class="card tight"><div class="sub" style="margin:0">Déjà relevés : ${ms.filter(x=>derniereMesure(x)).length} / ${ms.length}</div>
   <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Organe</th><th class="num">Q nom</th><th class="num">Q mesure</th><th class="num">L</th></tr></thead><tbody>
   ${ms.map(x=>{const mm=derniereMesure(x),l=lambda(x);return `<tr${x.id===n.id?' style="background:rgba(224,165,61,.08)"':""}><td>${esc(x.nom)}</td><td class="num mono">${fx(debitNominal(x),0)}</td><td class="num mono">${mm&&mm.q?fx(mm.q,0):"—"}</td><td class="num mono">${l!=null?fx(l,3):"—"}</td></tr>`;}).join("")}
   </tbody></table></div></div>`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn gho" id="wSkip">Passer</button><button class="btn pri" id="wNext">Valider →</button>`, stepInfo:{n:3,tot:6}};
}

/* --- ÉTAPE 4 : identification de la référence --- */
function wizRef(par,ms){
  const avec=ms.filter(n=>lambda(n)!=null);
  const tri=avec.slice().sort((a,b)=>lambda(a)-lambda(b));
  const ref=tri[0];
  if(ref){ WIZ.refId=ref.id; WIZ.lamRef=lambda(ref); }
  window.__wizBind=()=>{
    $$("[data-ref]").forEach(b=>b.onclick=()=>{ WIZ.refId=b.dataset.ref; WIZ.lamRef=lambda(noeud(b.dataset.ref)); renderWiz(); });
    $("#wNext").onclick=()=>{
      WIZ.file = tri.filter(x=>x.id!==WIZ.refId).map(x=>x.id);
      wizGo("regl",0);
    };
    $("#wBack").onclick=()=>wizGo("mes0",ms.length-1);
  };
  const spread = tri.length? (lambda(tri[tri.length-1])/lambda(tri[0])):1;
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">4</div><div>
      <h2>Organe de référence</h2>
      <p>Celui dont le rapport L = débit mesure / débit nominal est le <b>plus faible</b> : c'est le point le plus défavorisé du groupe. Sa vanne reste grande ouverte.</p></div></div>
    ${avec.length<2? '<div class="note d">Il faut au moins deux mesures pour désigner une référence.</div>':""}
    <div class="tbl-wrap"><table><thead><tr><th>Rang</th><th>Organe</th><th class="num">Q nom</th><th class="num">Q mesure</th><th class="num">L</th><th></th></tr></thead><tbody>
      ${tri.map((x,i)=>{const l=lambda(x);return `<tr${x.id===WIZ.refId?' style="background:rgba(78,168,106,.10)"':""}>
        <td class="mono">${i+1}</td><td>${esc(x.nom)}</td>
        <td class="num mono">${fx(debitNominal(x),0)}</td><td class="num mono">${fx(derniereMesure(x).q,0)}</td>
        <td class="num mono"><b>${fx(l,3)}</b></td>
        <td>${x.id===WIZ.refId?'<span class="tag ok">référence</span>':'<button class="btn xs" data-ref="'+x.id+'">choisir</button>'}</td></tr>`;}).join("")}
    </tbody></table></div>
    <div class="grid g3" style="margin-top:12px">
      <div class="kpi hi"><div class="k">L de référence</div><div class="v">${WIZ.lamRef!=null?fx(WIZ.lamRef,3):"—"}</div></div>
      <div class="kpi ${spread>2?"bad":spread>1.5?"":"good"}"><div class="k">Dispersion L max / L min</div><div class="v">${fx(spread,2)}</div></div>
      <div class="kpi"><div class="k">Organes à régler</div><div class="v">${Math.max(0,tri.length-1)}</div></div>
    </div>
    ${spread>3? '<div class="note d">Dispersion supérieure à 3 : le déséquilibre est majeur. Avant de régler, vérifiez qu\'il ne s\'agit pas d\'un <b>défaut physique</b> (vanne fermée, filtre colmaté, air, circuit obstrué) : l\'équilibrage ne répare pas un réseau malade, il ne fait que répartir ce qui circule.</div>':""}
    <div class="note i"><b>Ce qui va se passer.</b> Chaque organe va être ferme jusqu'à ce que son L rejoigne celui de la référence (${WIZ.lamRef!=null?fx(WIZ.lamRef,3):"—"}). On procède dans l'ordre des L croissants. A mesure que vous fermez, le débit de la référence augmente : c'est normal, et son L sera réactualisé en cours de route. A la fin, tous les L sont égaux : le groupe est <b>proportionnellement équilibré</b>. La vanne du niveau supérieur amènera ensuite tout le monde à L = 1,00.</div>
  </div>`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn pri" id="wNext">Régler les organes →</button>`, stepInfo:{n:4,tot:6}};
}

/* --- ÉTAPE 5 : réglage sequentiel (méthode proportionnelle) --- */
function wizRegl(par,ms){
  if(!WIZ.file || !WIZ.file.length) return wizFin(par,ms);
  const n=noeud(WIZ.file[WIZ.idx]);
  if(!n) return wizFin(par,ms);
  const ref=noeud(WIZ.refId);
  const lamRef=WIZ.lamRef!=null?WIZ.lamRef:(ref?lambda(ref):1);
  const qn=debitNominal(n);
  const cible=lamRef*qn;
  const m0=derniereMesure(n)||{};
  const ch=chartOf(n);
  /* estimation de la position cible */
  let estim=null;
  if(m0.q>0 && m0.dp>0 && cible>0){
    const kvNow=kvDepuisMesure(m0.q,m0.dp,P.fluide);
    const kvC=kvNow*(cible/m0.q);        /* 1er ordre : dp suppose peu variable sur la vanne */
    const posC = ch? positionDepuisKv(ch,kvC) : null;
    estim={kvNow,kvC,posC};
  }
  let get=null;
  window.__wizBind=()=>{
    get=mesureBind(n);
    $("#wNext").onclick=()=>{
      const m=get();
      if(!(m.q>0)){ flash("Saisissez le débit après réglage",true); return; }
      enregistrerMesure(n,m,"réglage");
      if(WIZ.idx<WIZ.file.length-1) wizGo("regl",WIZ.idx+1); else wizGo("fin");
    };
    $("#wBack").onclick=()=>{ if(WIZ.idx>0) wizGo("regl",WIZ.idx-1); else wizGo("ref"); };
    if($("#majRef")) $("#majRef").onclick=()=>majReference();
  };
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">5</div><div>
      <h2>Réglage ${WIZ.idx+1} / ${WIZ.file.length} — ${esc(n.nom)}</h2>
      <p>Fermer progressivement jusqu'à atteindre le débit vise. On ne cherche PAS le débit nominal à ce stade.</p></div></div>

    <div class="act"><b>Objectif de cette vanne</b>
      <p>Amener le débit de <b>${esc(n.nom)}</b> à <b>${fx(cible,0)} l/h</b><br>
      (soit L = ${fx(lamRef,3)}, le même rapport que l'organe de référence « ${ref?esc(ref.nom):"—"} »).<br>
      Débit actuel mesuré : ${m0.q?fx(m0.q,0)+" l/h":"—"} ${m0.q>cible?" → il faut FERMER":m0.q?" → il faut OUVRIR":""}</p></div>

    ${estim?`<div class="grid g3">
       <div class="kpi"><div class="k">Kv actuel</div><div class="v">${fx(estim.kvNow,3)}</div></div>
       <div class="kpi hi"><div class="k">Kv à viser</div><div class="v">${fx(estim.kvC,3)}</div></div>
       <div class="kpi"><div class="k">Position estimée</div><div class="v">${estim.posC!=null?fx(estim.posC,2):"—"}</div></div>
     </div>
     <div class="hint" style="margin-top:6px">${estim.posC!=null?"Position estimée à partir de l'abaque saisi : c'est un <b>point de départ</b>, pas une vérité. Réglez, puis remesurez.":"Sans abaque saisi, fermez par petits pas (1/4 de tour) en remesurant à chaque fois. La relation position/débit n'est pas linéaire : les derniers dixièmes de tour font chuter le débit très vite."}</div>`:""}

    <div class="note i" style="margin-top:12px"><b>Méthode de fermeture.</b> Fermez d'abord de moitié l'écart estimé, mesurez, puis corrigez. Deux ou trois itérations suffisent. Ne fermez jamais au-delà de <b>1/2 tour d'ouverture</b> sur une vanne statique : en dessous, le débit devient instable et bruyant — c'est le signe qu'il faut une vanne d'un DN inférieur.</div>
  </div>

  ${mesureBlocHTML(n,cible)}

  <div class="card tight">
    <div class="spread"><div><b style="font-size:13px">Référence : ${ref?esc(ref.nom):"—"}</b>
      <div style="font-size:11.5px;color:var(--faint)">L de référence courant : ${fx(lamRef,3)}</div></div>
      <button class="btn sm" id="majRef">Remesurer la référence</button></div>
    <div class="hint" style="margin-top:8px">A mesurer toutes les 2 ou 3 vannes réglées : le débit de la référence augmente au fur et à mesure que vous fermez les autres. Actualiser son L évite de sur-fermer les dernières vannes.</div>
  </div>

  <div class="card tight">
    <div class="tbl-wrap"><table><thead><tr><th>Organe</th><th class="num">Q nom</th><th class="num">Q actuel</th><th class="num">L</th><th>État</th></tr></thead><tbody>
    ${ms.map(x=>{const l=lambda(x),mm=derniereMesure(x);
      const st = x.id===WIZ.refId? '<span class="tag ok">référence</span>'
               : x.id===n.id? '<span class="tag amber">en cours</span>'
               : (l!=null&&lamRef&&Math.abs(l-lamRef)/lamRef<0.05)? '<span class="tag ok">aligné</span>'
               : WIZ.file.indexOf(x.id)<WIZ.idx? '<span class="tag warn">à revérifier</span>':'<span class="tag">à régler</span>';
      return `<tr><td>${esc(x.nom)}</td><td class="num mono">${fx(debitNominal(x),0)}</td><td class="num mono">${mm&&mm.q?fx(mm.q,0):"—"}</td><td class="num mono">${l!=null?fx(l,3):"—"}</td><td>${st}</td></tr>`;}).join("")}
    </tbody></table></div>
  </div>`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn pri" id="wNext">Valider et suivant →</button>`, stepInfo:{n:5,tot:6}};
}
function majReference(){
  const ref=noeud(WIZ.refId); if(!ref) return;
  const last=derniereMesure(ref)||{};
  openModal(`<div class="modal-h"><h3>Remesurer « ${esc(ref.nom)} »</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>
   <div class="grid g2">
     <label class="f"><span>dp mesure (kPa)</span><input type="number" step="0.1" id="r_dp" value="${last.dp!=null?last.dp:""}"></label>
     <label class="f"><span>Débit lu (l/h)</span><input type="number" id="r_q" value="${last.q!=null?Math.round(last.q):""}"></label>
   </div>
   <div class="hint">La vanne de référence ne bouge pas : on ne fait que constater l'augmentation de son débit.</div>
   <button class="btn pri wide" style="margin-top:12px" id="r_ok">Enregistrer</button>`);
  $("#r_ok").onclick=()=>{
    const q=+$("#r_q").value||0, dp=$("#r_dp").value===""?null:+$("#r_dp").value;
    if(!(q>0)){ flash("Débit requis",true); return; }
    enregistrerMesure(ref,{pos:ref.valve?ref.valve.pos:null,dp:dp,q:q},"référence");
    WIZ.lamRef=lambda(ref); autosave(); closeModal(); renderWiz(); flash("Référence actualisée : L = "+fx(WIZ.lamRef,3));
  };
}

/* --- MÉTHODE COMPENSÉE --- */
function wizComp(par,ms){
  const n=ms[WIZ.idx];
  if(!n) return wizFin(par,ms);
  const qn=debitNominal(n);
  let get=null;
  window.__wizBind=()=>{
    get=mesureBind(n);
    $("#wNext").onclick=()=>{
      const m=get();
      if(!(m.q>0)){ flash("Saisissez le débit obtenu",true); return; }
      enregistrerMesure(n,m,"compensée");
      if(WIZ.idx<ms.length-1) wizGo("comp",WIZ.idx+1); else wizGo("fin");
    };
    $("#wBack").onclick=()=>{ if(WIZ.idx>0) wizGo("comp",WIZ.idx-1); else wizGo("open"); };
    if($("#c_dpref")) $("#c_dpref").oninput=e=>{ WIZ.dpRef=+e.target.value||0; autosave(); };
  };
  const ordreInv=ms.slice().reverse();
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">${WIZ.idx+3}</div><div>
      <h2>Compensée ${WIZ.idx+1} / ${ms.length} — ${esc(n.nom)}</h2>
      <p>Réglage direct au débit nominal, un seul passage par vanne.</p></div></div>
    <div class="act"><b>Opérateur A — vanne partenaire « ${esc(par.nom)} »</b>
      <p>Maintenir constant le dp aux bornes de la vanne partenaire pendant toute l'opération. Chaque fois que B ferme une vanne, le dp monte : A rouvre légèrement pour revenir à la valeur de référence.</p></div>
    <label class="f"><span>dp de référence sur la vanne partenaire (kPa)</span><input type="number" step="0.1" id="c_dpref" value="${WIZ.dpRef||""}"></label>
    <div class="act"><b>Opérateur B — vanne « ${esc(n.nom)} »</b>
      <p>Régler cette vanne pour obtenir exactement <b>${fx(qn,0)} l/h</b> (débit nominal). Une fois atteint et le dp partenaire rétabli, valider et passer à la vanne suivante.</p></div>
    <div class="note i">Ordre de passage : <b>du plus éloigné au plus proche</b> de la pompe. Ordre défini à l'étape 1 (ici : ${ordreInv.map(x=>esc(x.nom)).join(" → ")}).</div>
  </div>
  ${mesureBlocHTML(n,qn)}`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn pri" id="wNext">Valider →</button>`, stepInfo:{n:Math.min(3+WIZ.idx,4),tot:4}};
}

/* --- ORGANES DYNAMIQUES : vérification --- */
function wizDyn(par,ms){
  const n=ms[WIZ.idx];
  if(!n) return wizFin(par,ms);
  const v=VALVES.find(x=>x.id===n.valve.id);
  const qn=debitNominal(n);
  window.__wizBind=()=>{
    $("#wNext").onclick=()=>{
      const dp=$("#d_dp").value===""?null:+$("#d_dp").value;
      const q =$("#d_q").value===""?null:+$("#d_q").value;
      const pos=$("#d_pos").value;
      enregistrerMesure(n,{pos:pos===""?null:+pos, dp:dp, q:q!=null?q:qn},"dynamique");
      n.reglageNote=$("#d_note").value;
      autosave();
      if(WIZ.idx<ms.length-1) wizGo("dyn",WIZ.idx+1); else wizGo("fin");
    };
    $("#wBack").onclick=()=>{ if(WIZ.idx>0) wizGo("dyn",WIZ.idx-1); else wizGo("prep"); };
    $("#d_dp").oninput=maj; maj();
    function maj(){
      const dp=+$("#d_dp").value||0;
      const mini=v.dpMin||16;
      const box=$("#d_diag");
      if(!dp){ box.innerHTML=""; return; }
      if(dp<mini) box.innerHTML='<div class="note d"><b>dp insuffisant : '+fx(dp,1)+' kPa &lt; '+mini+' kPa.</b> L\'organe ne peut PAS tenir son débit : le terminal sera en sous-débit et rien ne le signalera. Actions : augmenter la hauteur manométrique de la pompe, nettoyer le filtre amont, vérifier les vannes d\'isolement, ou revoir le dimensionnement du réseau.</div>';
      else if(dp>250) box.innerHTML='<div class="note">dp très élevé ('+fx(dp,0)+' kPa) : vérifiez le dp maximal admissible de l\'organe et le risque de bruit. Un régulateur de dp en pied de colonne est souvent la bonne réponse.</div>';
      else box.innerHTML='<div class="note g">dp de '+fx(dp,1)+' kPa : dans la plage de fonctionnement (mini '+mini+' kPa). L\'organe peut tenir son débit.</div>';
    }
  };
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">${WIZ.idx+2}</div><div>
      <h2>Vérification ${WIZ.idx+1} / ${ms.length} — ${esc(n.nom)}</h2>
      <p>${esc(CAT[v.cat].nom)} : rien à "équilibrer", tout à vérifier.</p></div></div>
    <div class="act"><b>1 · Réglage de débit</b><p>${esc(v.reglage)}<br>Débit à obtenir : <b>${fx(qn,0)} l/h</b>.</p></div>
    <div class="act"><b>2 · dp disponible</b><p>Mesurer le dp aux bornes de l'organe et vérifier qu'il est supérieur au dp minimal de fonctionnement (${v.dpMin||16} kPa pour cette famille — <b>à confirmer sur la notice de la version installée</b>).</p></div>
    <div class="grid g3">
      <label class="f"><span>Position / réglage</span><input id="d_pos" placeholder="ex. 60 % ou cartouche 250"></label>
      <label class="f"><span>dp mesure (kPa)</span><input type="number" step="0.1" id="d_dp"></label>
      <label class="f"><span>Débit constaté (l/h)</span><input type="number" id="d_q" placeholder="${fx(qn,0)}"></label>
    </div>
    <div id="d_diag"></div>
    <label class="f"><span>Observation (référence de cartouche, n° de série...)</span><input id="d_note" value="${esc(n.reglageNote||"")}"></label>
    <div class="note i">A noter impérativement sur le PV : la <b>référence exacte de la cartouche ou de la version</b>. C'est la seule façon, dans cinq ans, de savoir quel débit cet organe est censé délivrer.</div>
  </div>`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn pri" id="wNext">Valider →</button>`, stepInfo:{n:Math.min(2+WIZ.idx,4),tot:4}};
}

/* --- PRÉRÉGLAGE PAR LE CALCUL --- */
function wizPre(par,ms){
  window.__wizBind=()=>{
    $("#wNext").onclick=()=>wizGo("fin");
    $("#wBack").onclick=()=>wizGo("prep");
    $("#pr_dp").oninput=calc; calc();
    function calc(){
      const dpd=+$("#pr_dp").value||0;
      $("#pr_tbl").innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Organe</th><th class="num">Q nom (l/h)</th><th class="num">Kv nécessaire</th><th class="num">dp vanne (kPa)</th><th class="num">Position</th></tr></thead><tbody>
      ${ms.map(n=>{
        const q=debitNominal(n);
        const kv=dpd>0? kvNecessaire(q,dpd,P.fluide):null;
        const ch=chartOf(n);
        const pos=(ch&&kv)? positionDepuisKv(ch,kv):null;
        if(kv && n.valve){ n.valve.kvCible=kv; if(pos!=null) n.valve.posCible=pos; }
        return `<tr><td>${esc(n.nom)}</td><td class="num mono">${fx(q,0)}</td>
          <td class="num mono">${kv?fx(kv,3):"—"}</td><td class="num mono">${dpd?fx(dpd,1):"—"}</td>
          <td class="num mono">${pos!=null?fx(pos,2):'<span class="warn-inline">abaque manquant</span>'}</td></tr>`;}).join("")}
      </tbody></table></div>`;
      autosave();
    }
  };
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">2</div><div>
      <h2>Préréglage par le calcul</h2>
      <p>Sans appareil de mesure. A utiliser comme point de départ, jamais comme reception.</p></div></div>
    <div class="note d"><b>Limite à connaître.</b> Ce calcul suppose que toutes les vannes du groupe disposent du <b>même dp</b>, ce qui n'est vrai que si les pertes de charge des antennes sont négligeables devant celle des vannes. Sur un réseau réel, l'écart peut atteindre 30 %. Un contrôle à la mesure d'au moins le circuit le plus favorisé et le plus défavorisé reste indispensable.</div>
    <label class="f"><span>dp que chaque vanne doit absorber (kPa)</span><input type="number" step="0.5" id="pr_dp" value="10"></label>
    <div class="hint">Comment l'estimer ? dp disponible en pied de groupe moins la perte de charge de l'antenne et de l'émetteur. En l'absence de note de calcul, une valeur de <b>10 à 20 kPa</b> sur un organe terminal est un ordre de grandeur courant. Kv = Q(l/h) / (100 × √(dp en kPa)).</div>
    <div id="pr_tbl" style="margin-top:12px"></div>
    <div class="note i">Une fois les vannes préréglées, lancez un contrôle : au minimum, mesurez le circuit le plus proche et le plus éloigné. Si les deux sont dans la tolérance, le reste l'est probablement.</div>
  </div>`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn pri" id="wNext">Terminer →</button>`, stepInfo:{n:3,tot:4}};
}

/* --- ÉTAPE FINALE : contrôle et vanne partenaire --- */
function wizFin(par,ms){
  const ls=ms.map(n=>lambda(n)).filter(v=>v!=null);
  const lmin=ls.length?Math.min(...ls):null, lmax=ls.length?Math.max(...ls):null;
  const disp=(lmin&&lmax)?lmax/lmin:null;
  const qtot=ms.reduce((s,n)=>s+debitNominal(n),0);
  const qmes=ms.reduce((s,n)=>{const m=derniereMesure(n);return s+(m&&m.q?m.q:0);},0);
  const parVanne = par.valve? VALVES.find(v=>v.id===par.valve.id):null;
  const propOK = disp!=null && (disp-1)*100<=P.tolAnt*2;
  window.__wizBind=()=>{
    $("#wBack").onclick=()=>wizGo(WIZ.methode==="prop"?"regl":WIZ.methode==="comp"?"comp":WIZ.methode==="dyn"?"dyn":"pre", Math.max(0,(WIZ.methode==="prop"?(WIZ.file||[]).length:ms.length)-1));
    $("#wNext").onclick=()=>{ par.equilibre=true; par.equilibreDate=new Date().toISOString(); autosave(); WIZ=null; flash("Groupe équilibré"); go("equilibrage"); };
    if($("#pv_ok")) $("#pv_ok").onclick=()=>{
      const q=+$("#pv_q").value||0, dp=$("#pv_dp").value===""?null:+$("#pv_dp").value, pos=$("#pv_pos").value===""?null:+$("#pv_pos").value;
      if(!(q>0)){ flash("Débit requis",true); return; }
      enregistrerMesure(par,{pos:pos,dp:dp,q:q},"partenaire"); renderWiz(); flash("Vanne partenaire enregistrée");
    };
  };
  const body=`
  <div class="card">
    <div class="wizhead"><div class="wiznum">✓</div><div>
      <h2>Contrôle du groupe</h2>
      <p>Vérifier la proportionnalité, puis régler la vanne du niveau supérieur.</p></div></div>
    <div class="grid g3">
      <div class="kpi ${propOK?"good":"bad"}"><div class="k">Dispersion des L</div><div class="v">${disp!=null?fx(disp,3):"—"}</div></div>
      <div class="kpi"><div class="k">Débit nominal du groupe</div><div class="v">${fx(qtot,0)}<span class="u"> l/h</span></div></div>
      <div class="kpi hi"><div class="k">Débit mesure cumulé</div><div class="v">${fx(qmes,0)}<span class="u"> l/h</span></div></div>
    </div>
    ${propOK
      ? '<div class="note g">Les rapports L sont homogènes : le groupe est <b>proportionnellement équilibré</b>. Chaque organe recevra désormais sa juste part de ce qui entre dans le groupe.</div>'
      : '<div class="note d">Les rapports L restent dispersés (facteur '+(disp!=null?fx(disp,2):"—")+'). Reprenez les organes les plus éloignés de la référence. Si l\'écart persiste malgré le réglage, cherchez un défaut physique : vanne partiellement fermée, émetteur emboué, circuit obstrué, air.</div>'}
    <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Organe</th><th class="num">Q nom</th><th class="num">Q mesure</th><th class="num">L</th><th class="num">Position</th><th>Écart final estimé</th></tr></thead><tbody>
    ${ms.map(n=>{const l=lambda(n),mm=derniereMesure(n);
      /* après réglage de la vanne partenaire, tous les L seront ramenes à 1 : écart estimé = écart à la moyenne */
      const lmoy=ls.length?ls.reduce((a,b)=>a+b,0)/ls.length:null;
      const écart=(l!=null&&lmoy)? l/lmoy-1 : null;
      return `<tr><td>${esc(n.nom)}</td><td class="num mono">${fx(debitNominal(n),0)}</td>
        <td class="num mono">${mm&&mm.q?fx(mm.q,0):"—"}</td><td class="num mono">${l!=null?fx(l,3):"—"}</td>
        <td class="num mono">${mm&&mm.pos!=null?fx(mm.pos,2):"—"}</td>
        <td>${écart!=null?ecartTag(1+écart,1,n.type==="terminal"?P.tolTerm:P.tolAnt):'<span class="tag">—</span>'}</td></tr>`;}).join("")}
    </tbody></table></div>
    <div class="hint" style="margin-top:8px">L'écart final estimé est l'écart au débit nominal <b>une fois la vanne du niveau supérieur réglée</b> : c'est la proportionnalité entre organes qui compte ici, pas la valeur absolue.</div>
  </div>

  ${parVanne? `<div class="card">
    <h2>🎛️ Vanne partenaire — ${esc(par.nom)}</h2>
    <p class="sub">Cette vanne amène le débit total du groupe à sa valeur nominale : tous les L passent alors à 1,00 d'un seul geste.</p>
    <div class="act"><b>Objectif</b><p>Régler ${esc(parVanne.marque)} ${esc(parVanne.modele)} DN${par.valve.dn||"?"} pour obtenir <b>${fx(qtot,0)} l/h</b> au total du groupe.</p></div>
    <div class="grid g3">
      <label class="f"><span>Position (${esc(parVanne.posLabel||"tours")})</span><input type="number" step="0.1" id="pv_pos" value="${par.valve.pos!=null?par.valve.pos:""}"></label>
      <label class="f"><span>dp mesure (kPa)</span><input type="number" step="0.1" id="pv_dp"></label>
      <label class="f"><span>Débit obtenu (l/h)</span><input type="number" id="pv_q" placeholder="${fx(qtot,0)}"></label>
    </div>
    <button class="btn wide" id="pv_ok">Enregistrer le réglage de la vanne partenaire</button>
    ${derniereMesure(par)?'<div class="note g" style="margin-top:10px">Dernier relevé : '+fx(derniereMesure(par).q,0)+' l/h '+ecartTag(derniereMesure(par).q,qtot,P.tolAnt)+'</div>':""}
   </div>`
   : `<div class="note i">Ce groupe n'a pas de vanne partenaire déclarée sur « ${esc(par.nom)} ». Le débit total sera fixé par le niveau supérieur (colonne, bâtiment ou vanne générale). Si une vanne existe physiquement à ce niveau, ajoutez-la dans l'onglet Réseau : c'est elle qui permettra de passer de la proportionnalité au débit nominal.</div>`}

  <div class="card">
    <h3>Avant de quitter ce groupe</h3>
    <ul class="bul">
      <li><b>Bloquer et plomber</b> chaque réglage (vis de mémorisation). Une vanne non bloquée sera déplacée à la première intervention.</li>
      <li><b>Noter la position</b> sur une étiquette posée sur la vanne, en plus du rapport.</li>
      <li>Reposer les têtes thermostatiques et remettre la régulation en mode automatique <b>uniquement quand tout le réseau est équilibré</b>.</li>
      <li>Ne pas oublier de <b>réduire la pompe</b> à la fin de l'équilibrage complet : c'est là que se réalise l'économie d'énergie.</li>
    </ul>
  </div>`;
  return {body, bar:`<button class="btn" id="wBack">← Retour</button><button class="btn pri" id="wNext">Terminer ce groupe ✓</button>`, stepInfo:{n:6,tot:6}};
}

/* -------------------------------------------------------------------------
   14. VUE — ECS BOUCLÉE
   ------------------------------------------------------------------------- */
function vEcs(){
  const el=$("#v-ecs");
  const reseauxEcs=P.nodes.filter(n=>n.type==="reseau"&&n.mode==="ecs");
  const cols = reseauxEcs.flatMap(r=>P.nodes.filter(n=>chemin(n.id).some(c=>c.id===r.id)&&n.id!==r.id));
  P.ecs=P.ecs||{tDepart:55,tRetour:50,tProd:60,dtBoucle:5,releves:{}};
  const E=P.ecs;
  el.innerHTML=`
  <div class="card">
    <h2>🚿 Équilibrage d'une boucle d'ECS</h2>
    <p class="sub">Ici l'objectif n'est pas un débit mais une <b>température</b>. Le débit n'est qu'un moyen d'y parvenir.</p>
    <div class="note d"><b>Enjeu sanitaire.</b> Une boucle mal équilibrée créé des zones tièdes (30-45 °C) qui sont le milieu de développement idéal des légionelles. En France, la réglementation impose une température minimale en tout point du système de distribution d'eau chaude sanitaire (hors volumes terminaux limites), avec des exigences complémentaires sur le stockage. <b>Vérifiez le texte en vigueur applicable à votre établissement</b> : les valeurs ci-dessous sont des repères de conception courants, pas une citation réglementaire.</div>
  </div>

  <div class="card">
    <h3>Objectifs de température</h3>
    <div class="grid g2">
      <label class="f"><span>Température de production / stockage (°C)</span><input type="number" id="e_tp" value="${E.tProd}"></label>
      <label class="f"><span>Température de départ de boucle (°C)</span><input type="number" id="e_td" value="${E.tDepart}"></label>
      <label class="f"><span>Température minimale exigée au retour (°C)</span><input type="number" id="e_tr" value="${E.tRetour}"></label>
      <label class="f"><span>DT maximal admis sur la boucle (K)</span><input type="number" step="0.5" id="e_dt" value="${E.dtBoucle}"></label>
    </div>
    <div class="note i">Repères de conception les plus répandus : départ de boucle <b>≥ 55 °C</b>, retour <b>≥ 50 °C</b> en tout point, donc un DT de boucle limité à <b>5 K</b>. Côté confort et sécurité, la température aux points de puisage est limitée (risque de brûlure) : c'est le rôle du mitigeur, pas de l'équilibrage. Sur les vannes thermostatiques, une consigne de <b>55 à 57 °C</b> permet de tenir 50 °C au retour avec de la marge.</div>
  </div>

  <div class="card">
    <h3>Calcul du débit de chaque colonne</h3>
    <p class="sub">Le débit de bouclage d'une colonne compense exactement ses déperditions : Q (l/h) = déperditions (W) × 0,86 / DT (K).</p>
    <div class="tbl-wrap"><table><thead><tr><th>Colonne</th><th class="num">Long. A+R (m)</th><th class="num">W/m</th><th class="num">Déperdition (W)</th><th class="num">Débit (l/h)</th></tr></thead><tbody>
    ${cols.length? cols.map(n=>{
      const c=n.calc||{}; const w=(+c.longueur||0)*(+c.wparm||0);
      return `<tr><td>${esc(n.nom)}</td>
        <td class="num"><input type="number" style="width:74px" data-el="${n.id}" value="${c.longueur||""}"></td>
        <td class="num"><input type="number" step="0.5" style="width:66px" data-ew="${n.id}" value="${c.wparm||10}"></td>
        <td class="num mono">${fx(w,0)}</td>
        <td class="num mono"><b>${fx(debitDepuisPuissance(w/1000,E.dtBoucle,P.fluide),0)}</b></td></tr>`;}).join("")
      :'<tr><td colspan="5" style="color:var(--faint)">Aucune colonne ECS. Créez un réseau de type « ECS bouclée » dans l\'onglet Réseau, puis ajoutez ses colonnes.</td></tr>'}
    </tbody></table></div>
    <div class="hint" style="margin-top:8px">Déperditions linéaires indicatives : tube <b>calorifuge</b> 7 à 12 W/m ; tube <b>non calorifuge</b> 25 à 45 W/m ; gaine technique non ventilée, valeurs basses ; vide sanitaire ou local froid, valeurs hautes. Le débit total de la pompe de bouclage est la somme des colonnes.</div>
    <div class="grid g3" style="margin-top:12px">
      <div class="kpi hi"><div class="k">Débit total de bouclage</div><div class="v">${fx(cols.reduce((s,n)=>{const c=n.calc||{};return s+debitDepuisPuissance((+c.longueur||0)*(+c.wparm||0)/1000,E.dtBoucle,P.fluide);},0),0)}<span class="u"> l/h</span></div></div>
      <div class="kpi"><div class="k">Déperdition totale</div><div class="v">${fx(cols.reduce((s,n)=>{const c=n.calc||{};return s+(+c.longueur||0)*(+c.wparm||0);},0),0)}<span class="u"> W</span></div></div>
      <div class="kpi"><div class="k">Colonnes</div><div class="v">${cols.length}</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Relevé des températures de retour</h3>
    <p class="sub">Après réglage et <b>au moins 30 à 60 minutes de stabilisation</b>. Mesure sur tube dénudé, avec une sonde de contact.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Colonne</th><th class="num">T° retour (°C)</th><th>Conformité</th><th>Action</th></tr></thead><tbody>
    ${cols.length? cols.map(n=>{
      const t=E.releves[n.id];
      const ok=t!=null&&t>=E.tRetour;
      const dt = (t!=null)? E.tDepart-t : null;
      return `<tr><td>${esc(n.nom)}</td>
       <td class="num"><input type="number" step="0.1" style="width:80px" data-et="${n.id}" value="${t!=null?t:""}"></td>
       <td>${t==null?'<span class="tag">—</span>':ok?'<span class="tag ok">conforme</span>':'<span class="tag bad">insuffisant</span>'}</td>
       <td style="font-size:11.5px;color:var(--muted)">${t==null?"":ok?(dt<2?"DT très faible : colonne en sur-débit, fermer légèrement pour rendre du débit aux autres":"Conserver ce réglage"):"Colonne en sous-débit : ouvrir, OU fermer les colonnes trop chaudes"}</td></tr>`;}).join("")
      :'<tr><td colspan="4" style="color:var(--faint)">—</td></tr>'}
    </tbody></table></div>
    <div class="note">La bonne pratique n'est <b>pas</b> d'ouvrir en grand la colonne froide : cela ne fait que déplacer le problème. C'est de <b>fermer les colonnes trop chaudes</b> (DT faible), ce qui redistribue le débit vers les colonnes défavorisées sans augmenter la pompe.</div>
  </div>

  <div class="card">
    <h3>Procédure guidée</h3>
    <ol class="num">
      ${METHODES.ecs.etapes.map(e=>"<li>"+esc(e)+"</li>").join("")}
    </ol>
    <h3>Pièges spécifiques à l'ECS</h3>
    <ul class="bul">
      <li><b>L'inertie.</b> Une boucle met 30 à 60 min à se stabiliser. Régler puis mesurer 2 minutes après ne donne aucune information exploitable.</li>
      <li><b>La pompe de bouclage sur horloge.</b> Elle doit fonctionner en permanence : un arrêt nocturne fait chuter toute la boucle sous 50 °C.</li>
      <li><b>Les bras morts.</b> Un piquage non boucle de plus de quelques litres ne sera jamais chaud, quel que soit l'équilibrage. Le volume entre la boucle et le point de puisage doit rester faible (repère courant : 3 litres).</li>
      <li><b>Le calorifuge.</b> Une colonne non isolée perd 3 à 4 fois plus : elle est irrattrapable par l'équilibrage seul.</li>
      <li><b>Le mitigeage.</b> Ne jamais abaisser la température de production pour "régler" un problème de brûlure : c'est le mitigeur terminal qui protège, la boucle doit rester chaude.</li>
      <li><b>Les vannes thermostatiques.</b> Elles ne dispensent pas du calcul de débit : si la colonne est sous-dimensionnée, la vanne s'ouvre à fond et ne peut rien faire de plus.</li>
      <li><b>La désinfection thermique.</b> Vérifier que les vannes utilisées l'autorisent (ouverture forcée) et que les températures atteintes sont compatibles avec le reste du réseau.</li>
    </ul>
  </div>`;
  const b=(sel,k)=>{ const e=$(sel); if(e) e.oninput=()=>{E[k]=+e.value||0;autosave();render();}; };
  b("#e_tp","tProd"); b("#e_td","tDepart"); b("#e_tr","tRetour"); b("#e_dt","dtBoucle");
  $$("[data-el]",el).forEach(i=>i.oninput=()=>{const n=noeud(i.dataset.el);n.calc=n.calc||{};n.calc.mode="deperdition";n.calc.longueur=+i.value||0;n.calc.dtBoucle=E.dtBoucle;autosave();});
  $$("[data-ew]",el).forEach(i=>i.oninput=()=>{const n=noeud(i.dataset.ew);n.calc=n.calc||{};n.calc.mode="deperdition";n.calc.wparm=+i.value||0;n.calc.dtBoucle=E.dtBoucle;autosave();});
  $$("[data-et]",el).forEach(i=>i.onchange=()=>{E.releves[i.dataset.et]=i.value===""?null:+i.value;autosave();render();});
}

/* -------------------------------------------------------------------------
   16. VUE — GUIDE
   ------------------------------------------------------------------------- */
function vAide(){
  $("#v-aide").innerHTML=`
  <div class="card">
    <h2>📚 Guide de l'équilibrage</h2>
    <p class="sub">Tout ce qu'il faut comprendre avant de toucher une vanne.</p>
  </div>

  <div class="card">
    <h3>Pourquoi équilibrer</h3>
    <div class="dbody" style="padding:0">
      <p>L'eau prend toujours le chemin le plus facile. Sans organe de réglage, les circuits proches de la pompe absorbent l'essentiel du débit et les circuits éloignés sont sous-alimentés. Conséquences classiques :</p>
      <ul class="bul">
        <li>Des locaux surchauffés près de la chaufferie et des locaux froids en bout de réseau.</li>
        <li>Une température de départ augmentée "pour que ca passe partout" : surconsommation généralisée.</li>
        <li>Un DT effondre, qui degrade le rendement d'une chaudière à condensation ou le COP d'une pompe à chaleur.</li>
        <li>Une pompe surdimensionnée qui consomme et fait du bruit.</li>
        <li>En ECS, des zones tièdes propices au développement bactérien.</li>
      </ul>
      <p>Équilibrer, c'est donner à chaque circuit <b>exactement</b> le débit dont il a besoin — ni plus, ni moins.</p>
    </div>
  </div>

  <div class="card">
    <h3>Les formules à connaître</h3>
    <div class="dbody" style="padding:0">
      <h4>Débit et perte de charge</h4>
      <p><b>Q (l/h) = 100 × Kv × √(dp en kPa)</b> — pour l'eau. Kv est le débit en m³/h sous 1 bar.<br>
      Inversement : <b>Kv = Q / (100 × √dp)</b> et <b>dp = (Q / (100 × Kv))²</b>.</p>
      <p>Conséquence à retenir : le débit varie comme la <b>racine carrée</b> du dp. Doubler le dp n'augmente le débit que de 41 %.</p>
      <h4>Débit et puissance</h4>
      <p><b>Q (l/h) ≈ 860 × P (kW) / DT (K)</b> pour l'eau.<br>
      Conséquence : passer d'un régime 70/50 (DT 20 K) à un régime 55/45 (DT 10 K) <b>double</b> le débit nécessaire. Toute rénovation basse température impose donc un nouvel équilibrage, et parfois de nouvelles vannes.</p>
      <h4>Loi de similitude</h4>
      <p>Sur un circuit donne, si le débit change dans un rapport k, la perte de charge change dans un rapport k². C'est ce qui rend le réglage non linéaire : les derniers dixièmes de tour d'une vanne ont un effet énorme.</p>
      <h4>Autorité d'une vanne de régulation</h4>
      <p><b>à = dp vanne ouverte / dp total du circuit régulé</b>. En dessous de 0,25 la régulation devient instable (tout-ou-rien de fait). C'est l'une des raisons d'être des régulateurs de dp et des PICV.</p>
    </div>
  </div>

  <div class="card">
    <h3>Comment choisir la bonne technologie</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Situation</th><th>Solution adaptée</th><th>Pourquoi</th></tr></thead>
      <tbody>
      <tr><td>Réseau à débit constant, radiateurs sans thermostatique</td><td>Vannes statiques à double réglage</td><td>Le plus simple et le plus économique ; le réglage reste valable puisque les débits ne varient pas.</td></tr>
      <tr><td>Radiateurs avec robinets thermostatiques</td><td>Vannes statiques + régulateur de dp par colonne</td><td>Les thermostatiques font varier le dp ; sans stabilisateur, elles se gênent mutuellement et sifflent.</td></tr>
      <tr><td>Tertiaire à débit variable, vannes 2 voies motorisées</td><td>PICV ou limiteurs autorégulants</td><td>L'équilibrage reste valable à charge partielle, ce qui n'est pas le cas d'une vanne statique.</td></tr>
      <tr><td>Réseau très étendu, forte hauteur, dp très dispersés</td><td>Régulateurs de dp par bâtiment / colonne + statiques ou PICV</td><td>On découple hydrauliquement les sous-ensembles : chaque zone devient indépendante.</td></tr>
      <tr><td>Débits réels très inférieurs au dimensionnement (rénovation)</td><td>Vannes à mesure Venturi, ou DN inférieur</td><td>Une vanne trop grosse travaille presque fermée : mesure impossible et bruit.</td></tr>
      <tr><td>Boucle d'ECS</td><td>Vannes thermostatiques d'équilibrage (ou statiques + relevés de température)</td><td>L'objectif est une température ; la vanne thermostatique s'adapté seule aux variations de puisage.</td></tr>
      <tr><td>Réseau ancien sans prise de pression</td><td>Débitmètre à ultrasons, ou remplacement des organes</td><td>On ne peut pas équilibrer ce qu'on ne peut pas mesurer.</td></tr>
      </tbody></table></div>
  </div>

  <div class="card">
    <h3>Ordre d'intervention sur un site complexe</h3>
    <ol class="num">
      <li><b>État des lieux</b> : schéma, repérage des vannes, identification des technologies présentes (statique / dynamique / PICV), relevé des puissances et des régimes.</li>
      <li><b>Remise en état préalable</b> : désembouage si nécessaire, filtres, purges, vase d'expansion, vérification de la pompe.</li>
      <li><b>Calcul des débits nominaux</b> de chaque émetteur, de chaque colonne, de chaque bâtiment.</li>
      <li><b>Vérification du dimensionnement des vannes</b> : chaque organe doit pouvoir absorber au moins 3 kPa au débit nominal, sans dépasser 25-30 kPa.</li>
      <li><b>Équilibrage du niveau le plus fin</b> (émetteurs d'une même antenne), antenne par antenne.</li>
      <li><b>Équilibrage des antennes entre elles</b>, puis des colonnes, puis des bâtiments.</li>
      <li><b>Réglage du débit total</b> à la vanne générale ou au départ de chaque chaufferie.</li>
      <li><b>Optimisation de la pompe</b> : réduire la hauteur manométrique jusqu'à la limite basse acceptable au point le plus défavorisé, puis repasser en dp variable si le réseau le permet.</li>
      <li><b>Remise en service de la régulation</b> : repose des têtes thermostatiques, retour en automatique, vérification du DT.</li>
      <li><b>PV d'équilibrage</b> : positions, débits, dp, températures, plombage des réglages.</li>
    </ol>
    <div class="note i">Plusieurs chaufferies, plusieurs réseaux ? On traite <b>un réseau à la fois</b>, en isolant hydrauliquement les autres si c'est possible. Les réseaux couples par une bouteille de découplage ou un échangeur s'équilibrent indépendamment de part et d'autre : primaire d'abord, secondaire ensuite.</div>
  </div>

  <div class="card">
    <h3>Les 10 erreurs qui ruinent un équilibrage</h3>
    <ul class="bul">
      <li>Équilibrer un réseau emboué ou mal purge : tout sera à refaire après nettoyage.</li>
      <li>Laisser la pompe en dp variable : les mesures ne se stabilisent jamais.</li>
      <li>Laisser les têtes thermostatiques en place : elles ferment quand le local chauffe et faussent tout.</li>
      <li>Ne pas fermer les by-pass et soupapes différentielles : une partie du débit court-circuite le réseau.</li>
      <li>Oublier de purger les flexibles de l'appareil : une bulle d'air, et le dp est faux de plusieurs kPa.</li>
      <li>Mesurer un dp inférieur à 3 kPa et prendre le résultat pour argent comptant.</li>
      <li>Commencer par la vanne générale au lieu de finir par elle.</li>
      <li>Confondre position de réglage et position de fermeture : la vanne est refermée et le réglage perdu.</li>
      <li>Ne pas bloquer ni plomber les réglages : le premier dépannage venu les efface.</li>
      <li>Ne pas réduire la pompe à la fin : le confort est rétabli mais l'économie d'énergie n'a pas eu lieu.</li>
    </ul>
  </div>

  <div class="card">
    <h3>Repères normatifs et réglementaires</h3>
    <div class="dbody" style="padding:0">
      <ul class="bul">
        <li><b>NF EN 14336</b> — installations de chauffage à eau chaude : installation et reception, y compris l'équilibrage.</li>
        <li><b>NF EN 15378</b> — inspection des chaudières et des systèmes de chauffage.</li>
        <li><b>NF EN 12828</b> — conception des systèmes de chauffage à eau.</li>
        <li><b>NF DTU 65.x</b> — travaux de chauffage central et d'installations de génie climatique.</li>
        <li><b>Réglementation sanitaire ECS</b> — températures minimales dans les réseaux d'eau chaude sanitaire et règles de prévention du risque légionelles.</li>
        <li><b>Réglementation énergétique et décret BACS</b> — obligations de régulation et de pilotage des installations techniques de bâtiment.</li>
      </ul>
      <div class="note d">Ces références sont données à titre de repères. <b>Vérifiez systématiquement la version en vigueur</b> et le texte applicable à votre type d'établissement avant de vous en prévaloir dans un document contractuel.</div>
    </div>
  </div>

  <div class="card">
    <h3>Glossaire</h3>
    <div class="tbl-wrap"><table><tbody>
      <tr><td style="width:30%"><b>dp</b></td><td>Pression différentielle, en kPa. 100 kPa = 1 bar = 10 mCE.</td></tr>
      <tr><td><b>Kv / Kvs</b></td><td>Coefficient de débit : débit en m³/h sous 1 bar. Kvs = valeur vanne grande ouverte.</td></tr>
      <tr><td><b>L (lambda)</b></td><td>Rapport débit mesure / débit nominal. Coeur de la méthode proportionnelle.</td></tr>
      <tr><td><b>Vanne partenaire</b></td><td>Vanne du niveau supérieur (antenne, colonne) qui fixe le débit total d'un groupe.</td></tr>
      <tr><td><b>Circuit défavorisé</b></td><td>Circuit qui dispose du moins de dp : c'est lui qui dicte le réglage de la pompe.</td></tr>
      <tr><td><b>DPCV</b></td><td>Régulateur de pression différentielle : stabilise le dp d'un tronçon.</td></tr>
      <tr><td><b>PICV</b></td><td>Vanne de régulation indépendante de la pression : débit maxi réglable + régulation modulante.</td></tr>
      <tr><td><b>Autorité</b></td><td>Part du dp du circuit réellement pilotée par la vanne de régulation.</td></tr>
      <tr><td><b>Bouteille de découplage</b></td><td>Organe qui rend indépendants les débits primaire et secondaire.</td></tr>

  const instr = INSTRUMENTS.map(i=>`- ${i.marque} ${i.modele} | ${i.type}${i.multimarque?" | multimarque":" | base constructeur"}`).join("\n");
  const meth = Object.values(METHODES).map(m=>`- ${m.nom} : ${m.principe}`).join("\n");
  return `FORMULES DE RÉFÉRENCE (celles utilisées par l'application) :
- Q(l/h) = 100 x Kv x RACINE(dp[kPa] / d)   avec d = densité relative du fluide
- Kv = Q(l/h) / (100 x RACINE(dp[kPa]))     -> Kv réel déduit de toute mesure
- Q(l/h) = P(kW) x 3600 x 1000 / (rho x cp x DT)  soit environ 860 x P / DT pour l'eau
- Perte de charge d'un circuit : varie en Q^2
- Autorité d'une vanne de régulation : a = dp vanne ouverte / dp total du circuit (viser >= 0,25)
- Seuil de fiabilité de mesure sur vanne statique : dp >= 3 kPa ; dp terminal souhaitable 3 à 25 kPa

de Kvs, de nombre de tours ou de dp mini. Si la valeur est nécessaire, demande à l'utilisateur

function aiContexte(){
  if(!P) return "Aucun chantier ouvert dans l'application.";
  const li=[];
  li.push(`CHANTIER : ${P.nom} | client : ${P.client||"non renseigné"} | date : ${P.date} | opérateur : ${P.operateur||"non renseigné"}`);
  li.push(`Fluide : ${FLUIDES[P.fluide].nom} | tolérances : +/- ${P.tolTerm} % sur émetteur, +/- ${P.tolAnt} % sur antenne et total`);
  const ins=INSTRUMENTS.find(i=>i.id===P.instrument);
  li.push(`Appareil de mesure : ${ins? ins.marque+" "+ins.modele : "AUCUN déclaré"}`);
  const nb=CHECKLIST_AVANT.length, ok=Object.values(P.checklist).filter(Boolean).length;
  li.push(`Contrôles préalables : ${ok}/${nb} validés` + (ok<nb? " -> MANQUANTS : "+CHECKLIST_AVANT.filter((c,i)=>!P.checklist[i]).map(c=>c.t).join(" ; ") : ""));
  li.push("");
  li.push("ARBORESCENCE (indentation = niveau ; Qn = débit nominal l/h ; Qm = dernier débit mesuré l/h ; L = Qm/Qn) :");
  const ligne=(n,prof)=>{
    const m=derniereMesure(n), l=lambda(n), v=n.valve? VALVES.find(x=>x.id===n.valve.id):null;
    li.push("  ".repeat(prof)+`- [${n.type}] ${n.nom} | Qn=${Math.round(debitNominal(n))}`
      + (v? ` | vanne=${v.marque} ${v.modele} DN${n.valve.dn||"?"} (${v.cat})`:" | AUCUNE VANNE")
      + (m? ` | Qm=${m.q?Math.round(m.q):"?"}${m.dp!=null?" dp="+m.dp+"kPa":""}${m.pos!=null?" pos="+m.pos:""}`:" | non mesuré")
      + (l!=null? ` | L=${l.toFixed(3)}`:""));
    enfants(n.id).forEach(k=>ligne(k,prof+1));
  };
  racines().forEach(n=>ligne(n,0));
  if(P.ecs && Object.keys(P.ecs.releves||{}).length){
    li.push("");
    li.push(`ECS : départ de boucle visé ${P.ecs.tDepart} °C, minimum au retour ${P.ecs.tRetour} °C, DT admis ${P.ecs.dtBoucle} K`);
    Object.entries(P.ecs.releves).forEach(([k,v])=>{ const n=noeud(k); if(v!=null) li.push(`  - ${n?n.nom:k} : retour ${v} °C`); });
  }
  li.push("");
  li.push(`ÉCRAN EN COURS : ${VIEW}` + (WIZ? ` | assistant actif : méthode ${WIZ.methode}, étape ${WIZ.stage}, groupe « ${(wizPar()||{}).nom||"?"} »`:""));
  if(P.notes) li.push(`NOTES DE L'OPÉRATEUR : ${P.notes}`);
  return li.join("\n");
}

/* --- Appel API --- */
async function aiAppel(question, phase){
  let src=(P? P.chat : AI_CHAT)||[];
  /* la question courante vient d'etre ajoutee a l'historique : on ne l'envoie pas deux fois */
  if(src.length && src[src.length-1].role==="user" && src[src.length-1].content===question) src=src.slice(0,-1);
  const hist=src.slice(-10).map(m=>({role:m.role, content:m.content}));
  const messages=hist.concat([{role:"user", content:question}]);
  const resp = await fetch(aiEndpoint(),{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-5", max_tokens:3000, system:aiSystem(phase), messages:messages })
  });
  const txt = await resp.text();
  let data=null; try{ data=JSON.parse(txt); }catch(e){}
  if(!resp.ok){
    const msg = (data&&(data.error&&(data.error.message||data.error)))||txt.slice(0,300);
    if(resp.status===500 && String(msg).includes("ANTHROPIC_API_KEY"))
      throw new Error("La clé API n'est pas configurée sur le serveur. Dans Netlify : Site settings > Environment variables > ajouter ANTHROPIC_API_KEY, puis redéployer.");
    throw new Error("Erreur "+resp.status+" : "+msg);
  }
  if(!data||!data.content) throw new Error("Réponse inattendue du serveur.");
  return data.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();
}

/* --- Rendu markdown minimal --- */
function mdLite(t){
  let h=esc(t);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre style="background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:12px">'+c.trim()+'</pre>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/`([^`]+)`/g,'<code style="background:var(--bg2);padding:1px 5px;border-radius:4px;font-size:12.5px">$1</code>');
  h=h.replace(/^#{1,4}\s*(.+)$/gm,'<h4 style="color:var(--amber);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 5px">$1</h4>');
  h=h.replace(/^\s*[-•*]\s+(.+)$/gm,'<li style="margin-left:16px">$1</li>');
  h=h.replace(/^\s*(\d+)[.)]\s+(.+)$/gm,'<div style="display:flex;gap:8px;margin:4px 0"><b style="color:var(--amber);flex-shrink:0">$1.</b><div>$2</div></div>');
  h=h.replace(/(Prochaine action\s*:.*)$/mi,'<div class="note g" style="margin-top:10px"><b>$1</b></div>');
  h=h.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  h=h.replace(/(<br>)*(<li)/g,'$2').replace(/(<\/li>)(<br>)+/g,'$1');
  return h;
}

function visRedim(source, l, h){
  const max=VIS_LARGEUR, r=Math.min(1, max/Math.max(l,h));
  const c=document.createElement("canvas");
  c.width=Math.round(l*r); c.height=Math.round(h*r);
  c.getContext("2d").drawImage(source,0,0,c.width,c.height);
  return c;
}
/* empreinte 16x16 en niveaux de gris, pour écarter les images quasi identiques */
function visEmpreinte(canvas){
  const c=document.createElement("canvas"); c.width=16; c.height=16;
  const x=c.getContext("2d"); x.drawImage(canvas,0,0,16,16);
  const d=x.getImageData(0,0,16,16).data, out=[];
  for(let i=0;i<d.length;i+=4) out.push((d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0);
  return out;
}
function visDistance(a,b){
  if(!a||!b) return 999;
  let s=0; for(let i=0;i<a.length;i++) s+=Math.abs(a[i]-b[i]);
  return s/a.length;
}
function visAjouter(canvas, manuelle, tag){
  const emp=visEmpreinte(canvas);
  if(!manuelle && visDistance(emp, VIS.dernier) < 9) return false;  /* image quasi identique */
  VIS.dernier=emp;
  const data=canvas.toDataURL("image/jpeg", VIS_QUALITE);
  VIS.frames.push({data:data, manuelle:!!manuelle, t:Math.round(VIS.duree/1000), tag:tag||"",
                   poids:Math.round(data.length*0.75/1024)});
  return true;
}

/* ---------------- caméra ---------------- */
async function visDemarrer(){
  try{
    VIS.stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}},
      audio:true});
  }catch(e){
    VIS.erreur = "Impossible d'accéder à la caméra : "+e.message+
      ". Vérifiez que vous avez autorisé la caméra et le micro, et que la page est bien en HTTPS. Vous pouvez sinon importer une vidéo ou des photos.";
    vVisite(); return;
  }
  VIS.phase="record"; VIS.erreur=""; VIS.frames=[]; VIS.transcript=""; VIS.dernier=null;
  vVisite();
  const v=$("#visVideo"); v.srcObject=VIS.stream; v.muted=true; await v.play().catch(()=>{});
  /* enregistrement du film (conservé en local, jamais envoyé) */
  try{
    const mt=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"]
             .find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    VIS.rec=new MediaRecorder(VIS.stream, mt?{mimeType:mt}:undefined);
    VIS.chunks=[];
    VIS.rec.ondataavailable=e=>{ if(e.data && e.data.size) VIS.chunks.push(e.data); };
    VIS.rec.start(1000);
  }catch(e){ VIS.rec=null; }
  /* piste audio enregistrée à part, à bas débit : c'est elle qui part à la transcription */
  try{
    const pisteAudio=new MediaStream(VIS.stream.getAudioTracks());
    const ma=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"]
             .find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    VIS.arec=new MediaRecorder(pisteAudio, ma?{mimeType:ma, audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});
    VIS.achunks=[];
    VIS.arec.ondataavailable=e=>{ if(e.data && e.data.size) VIS.achunks.push(e.data); };
    VIS.arec.start(2000);
  }catch(e){ VIS.arec=null; }
  visEcouteDemarrer();
  VIS.t0=Date.now();
  VIS.timer=setInterval(()=>{
    VIS.duree=Date.now()-VIS.t0;
    const c=$("#visChrono"); if(c) c.textContent=visMMSS(VIS.duree);
    if(VIS.frames.length<40 && VIS.duree % VIS_INTERVALLE < 1100) visCapture(false);
  },1000);
}
function visMMSS(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function visCapture(manuelle){
  const v=$("#visVideo");
  if(!v || !v.videoWidth) return;
  const c=visRedim(v, v.videoWidth, v.videoHeight);
  const ajoute=visAjouter(c, manuelle);
  if(manuelle){ flash(ajoute?"Photo ajoutée":"Photo ajoutée"); }
  const st=$("#visStrip"); if(st) st.innerHTML=visStripHTML();
  const n=$("#visNb"); if(n) n.textContent=VIS.frames.length;
  visBindStrip();
}
function visArreter(){
  if(VIS.timer){ clearInterval(VIS.timer); VIS.timer=null; }
  let attente=0;
  const fini=()=>{ if(--attente<=0) visPipeline(); };
  if(VIS.rec && VIS.rec.state!=="inactive"){
    attente++;
    VIS.rec.onstop=()=>{ try{ VIS.videoURL=URL.createObjectURL(new Blob(VIS.chunks,{type:VIS.chunks[0]?VIS.chunks[0].type:"video/webm"})); }catch(e){} fini(); };
    VIS.rec.stop();
  }
  if(VIS.arec && VIS.arec.state!=="inactive"){
    attente++;
    VIS.arec.onstop=()=>{ try{ if(VIS.achunks.length) VIS.audioSource=new Blob(VIS.achunks,{type:VIS.achunks[0].type||"audio/webm"}); }catch(e){} fini(); };
    VIS.arec.stop();
  }
  visEcouteArreter();
  if(VIS.stream){ VIS.stream.getTracks().forEach(t=>t.stop()); VIS.stream=null; }
  VIS.phase="analyse"; VIS.etape="Finalisation de l'enregistrement…"; VIS.progres=0; vVisite();
  if(!attente) visPipeline();
}

/* ---------------- reconnaissance vocale ---------------- */
function visRecoDispo(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function visEcouteDemarrer(){
  if(!visRecoDispo()) return;
  try{
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    const r=new R(); r.lang="fr-FR"; r.continuous=true; r.interimResults=true;
    r.onresult=e=>{
      let inter="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) VIS.transcript += (VIS.transcript?" ":"")+t.trim();
        else inter += t;
      }
      VIS.interim=inter;
      const l=$("#visLive");
      if(l){ l.innerHTML=esc(VIS.transcript)+(inter?' <i>'+esc(inter)+'</i>':""); l.scrollTop=l.scrollHeight; }
    };
    r.onerror=()=>{};
    r.onend=()=>{ if(VIS.ecoute){ try{ r.start(); }catch(e){} } };
    VIS.reco=r; VIS.ecoute=true; r.start();
  }catch(e){ VIS.reco=null; }
}
function visEcouteArreter(){ VIS.ecoute=false; if(VIS.reco){ try{ VIS.reco.stop(); }catch(e){} VIS.reco=null; } }

/* ---------------- import de fichiers ---------------- */
function visImportVideo(file){
  return new Promise(resolve=>{
    const v=document.createElement("video");
    v.preload="metadata"; v.muted=true; v.playsInline=true;
    v.src=URL.createObjectURL(file);
    v.onloadedmetadata=async ()=>{
      const dur=v.duration;
      if(!isFinite(dur)||dur<=0){ resolve(0); return; }
      const n=Math.min(VIS_MAX_IMG+4, Math.max(4, Math.round(dur/3)));
      let pris=0;
      for(let i=0;i<n;i++){
        const t=dur*(i+0.5)/n;
        await new Promise(r=>{ v.onseeked=r; v.currentTime=t; setTimeout(r,1500); });
        if(!v.videoWidth) continue;
        VIS.duree=t*1000;
        if(visAjouter(visRedim(v, v.videoWidth, v.videoHeight), false)) pris++;
        VIS.etape="Extraction des images "+(i+1)+" / "+n; VIS.progres=(i+1)/n; vVisite();
      }
      VIS.videoURL=v.src;
      VIS.audioSource=file;      /* le son du fichier importé est transcrit lui aussi */
      resolve(pris);
    };
    v.onerror=()=>resolve(0);
  });
}
function visImportPhotos(files){
  return Promise.all(Array.from(files).slice(0,VIS_MAX_IMG).map(f=>new Promise(res=>{
    const img=new Image();
    img.onload=()=>{ visAjouter(visRedim(img, img.naturalWidth, img.naturalHeight), true); res(); };
    img.onerror=()=>res();
    img.src=URL.createObjectURL(f);
  })));
}

/* ---------------- sélection des images envoyées ---------------- */
function visSelection(){
  const man=VIS.frames.filter(f=>f.manuelle);
  const auto=VIS.frames.filter(f=>!f.manuelle);
  const place=Math.max(0, VIS_MAX_IMG-man.length);
  const pas=auto.length>place? auto.length/place : 1;
  const pris=[];
  for(let i=0;i<auto.length && pris.length<place;i+=pas) pris.push(auto[Math.floor(i)]);
  return man.concat(pris).slice(0,VIS_MAX_IMG);
}
function visPoids(list){
  const ko=list.reduce((s,f)=>s+f.poids,0);
  return ko<100? "&lt; 0,1" : String(Math.round(ko/1024*10)/10).replace(".",",");
}

/* ---------------- appels API ---------------- */
async function aiRequete(payload, timeoutMs){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(), timeoutMs||45000);
  let resp;
  try{
    resp = await fetch(aiEndpoint(),{method:"POST", headers:{"Content-Type":"application/json"},
                                    body:JSON.stringify(payload), signal:ctrl.signal});
  }catch(e){
    clearTimeout(to);
    if(e.name==="AbortError") throw new Error("Le serveur a mis trop de temps à répondre. Réessayez avec moins d'images, ou en meilleure connexion.");
    throw new Error("Connexion impossible au serveur : "+e.message);
  }
  clearTimeout(to);
  const txt=await resp.text();
  let data=null; try{ data=JSON.parse(txt); }catch(e){}
  if(!resp.ok){
    const msg=(data&&data.error&&(data.error.message||data.error))||txt.slice(0,300);
    if(String(msg).includes("ANTHROPIC_API_KEY"))
      throw new Error("La clé API n'est pas configurée sur le serveur. Dans Netlify : Site settings > Environment variables > ajouter ANTHROPIC_API_KEY, puis redéployer.");
    throw new Error("Erreur "+resp.status+" : "+msg);
  }
  if(!data) throw new Error("Réponse illisible du serveur.");
  return data;
}
function aiOutilResultat(data, nom){
  const bloc=(data.content||[]).find(c=>c.type==="tool_use" && (!nom||c.name===nom));
  if(bloc) return bloc.input;
  const t=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
  const m=t.match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}
function imgBloc(f){
  return {type:"image", source:{type:"base64", media_type:"image/jpeg", data:f.data.split(",")[1]}};
