<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12130f">
<meta name="description" content="Assistant d'équilibrage hydraulique pas à pas : réseaux de chaleur, ECS bouclée, chauffage collectif et industriel. Toutes marques de vannes (TA/IMI, Oventrop, Stabiflo, Danfoss, Caleffi, Herz...) et tous appareils de mesure (Midor, TA-SCOPE, OV-DMC...).">
<title>ÉQUILIBRAGE PRO · Assistant d'équilibrage hydraulique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#12130f; --bg2:#191a15; --panel:#1f211a; --panel2:#262922;
  --line:rgba(240,238,230,.10); --line2:rgba(240,238,230,.18);
  --txt:#f0eee6; --muted:rgba(240,238,230,.52); --faint:rgba(240,238,230,.32);
  --amber:#e0a53d; --amber2:#f5c25e; --amberdim:rgba(224,165,61,.13);
  --ok:#4ea86a; --okdim:rgba(78,168,106,.14);
  --warn:#e0a53d; --warndim:rgba(224,165,61,.14);
  --bad:#d4574e; --baddim:rgba(212,87,78,.14);
  --info:#5b9bd5; --infodim:rgba(91,155,213,.14);
  --r:12px; --rs:8px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;font-size:15px;line-height:1.55;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--amber2)}

/* ---------- LAYOUT ---------- */
.app{display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:60;background:rgba(18,19,15,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:1180px;margin:0 auto;width:100%}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
.brand b{font-weight:600;letter-spacing:.16em;font-size:13px}
.brand b em{color:var(--amber);font-style:normal}
.brand span{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:.15s}
.iconbtn:hover{border-color:var(--line2);background:var(--panel2)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;max-width:1180px;margin:0 auto;width:100%;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;padding:7px 13px;border-radius:20px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px;letter-spacing:.02em;transition:.15s}
nav.tabs button:hover{color:var(--txt);background:rgba(255,255,255,.04)}
nav.tabs button.on{background:var(--amberdim);border-color:rgba(224,165,61,.4);color:var(--amber2);font-weight:500}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 14px calc(90px + var(--safe-b))}
.view{display:none;animation:fade .2s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- BLOCS ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.card h2{font-size:15px;font-weight:600;letter-spacing:.02em;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h3{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);margin:16px 0 8px}
.card h3:first-child{margin-top:0}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.sectitle{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sectitle:before{content:"";flex:0 0 18px;height:1px;background:var(--amber);opacity:.6}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ---------- FORMULAIRES ---------- */
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:rgba(224,165,61,.55);background:#1c1d17}
input[type=checkbox]{width:auto}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0a53d' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:34px}
textarea{resize:vertical;min-height:70px}
.hint{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.45}

.btn{padding:10px 16px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:13.5px;transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--amber);color:var(--amber2)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#171712;font-weight:600}
.btn.pri:hover{background:var(--amber2);color:#171712}
.btn.gho{background:transparent;border-color:var(--line)}
.btn.dgr{border-color:rgba(212,87,78,.4);color:#e8877f}
.btn.dgr:hover{background:var(--baddim);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.xs{padding:4px 8px;font-size:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ---------- BADGES / ETATS ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--okdim);border-color:rgba(78,168,106,.45);color:#7fd398}
.tag.warn{background:var(--warndim);border-color:rgba(224,165,61,.45);color:var(--amber2)}
.tag.bad{background:var(--baddim);border-color:rgba(212,87,78,.45);color:#e8877f}
.tag.info{background:var(--infodim);border-color:rgba(91,155,213,.45);color:#8fbde8}
.tag.amber{background:var(--amberdim);border-color:rgba(224,165,61,.4);color:var(--amber2)}

.note{border-left:3px solid var(--amber);background:var(--amberdim);padding:10px 12px;border-radius:0 var(--rs) var(--rs) 0;font-size:12.5px;line-height:1.6;margin:10px 0}
.note.i{border-color:var(--info);background:var(--infodim)}
.note.d{border-color:var(--bad);background:var(--baddim)}
.note.g{border-color:var(--ok);background:var(--okdim)}
.note b{color:var(--amber2)}
.note.i b{color:#8fbde8}.note.d b{color:#e8877f}.note.g b{color:#7fd398}

/* ---------- TABLEAUX ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:rgba(255,255,255,.025)}
table input,table select{padding:5px 7px;font-size:12px}

/* ---------- ARBRE ---------- */
.tree{font-size:13px}
.tnode{border:1px solid var(--line);border-radius:var(--rs);margin-bottom:6px;background:var(--bg2);overflow:hidden}
.tnode-h{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
.tnode-h:hover{background:rgba(255,255,255,.03)}
.tnode-ic{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:var(--panel2);border:1px solid var(--line)}
.tnode-t{flex:1;min-width:0}
.tnode-t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode-t small{color:var(--faint);font-size:11px}
.tkids{padding:0 0 6px 16px;border-left:1px dashed var(--line2);margin-left:20px}
.chev{transition:.2s;color:var(--faint);font-size:11px}
.chev.open{transform:rotate(90deg)}

/* ---------- WIZARD ---------- */
.steps{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.stepdot{flex:1;min-width:26px;height:4px;border-radius:2px;background:var(--line2);transition:.25s}
.stepdot.done{background:var(--ok)}
.stepdot.cur{background:var(--amber)}
.wizhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.wiznum{width:38px;height:38px;border-radius:10px;background:var(--amber);color:#171712;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.wizhead h2{font-size:17px;line-height:1.25}
.wizhead p{font-size:12.5px;color:var(--muted);margin-top:3px}
.wizbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(18,19,15,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b))}
.wizbar-in{max-width:1180px;margin:0 auto;display:flex;gap:8px}
.wizbar .btn{flex:1}

.act{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:0 var(--rs) var(--rs) 0;padding:12px 14px;margin-bottom:10px}
.act b{color:var(--amber2);display:block;margin-bottom:3px;font-size:13px}
.act p{font-size:13px;line-height:1.6;color:rgba(240,238,230,.85)}

ul.chk{list-style:none}
ul.chk li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
ul.chk li:last-child{border-bottom:none}
ul.chk input{width:19px;height:19px;flex-shrink:0;margin-top:1px;accent-color:var(--amber)}
ul.chk .why{font-size:11.5px;color:var(--faint);display:block;margin-top:2px}

ul.bul{list-style:none;font-size:13px}
ul.bul li{padding:4px 0 4px 16px;position:relative;line-height:1.55}
ul.bul li:before{content:"";position:absolute;left:3px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--amber);opacity:.7}
ol.num{padding-left:20px;font-size:13px}
ol.num li{padding:4px 0;line-height:1.55}

/* ---------- RÉSULTATS ---------- */
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:12px}
.kpi .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font-size:22px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .u{font-size:12px;color:var(--muted);font-weight:400}
.kpi.hi .v{color:var(--amber2)}
.kpi.good .v{color:#7fd398}
.kpi.bad .v{color:#e8877f}

.bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;transition:.4s}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,9,7,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.on{display:flex}
.modal-in{background:var(--panel);border:1px solid var(--line2);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;padding:18px 16px calc(18px + var(--safe-b));animation:up .22s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;position:sticky;top:-18px;background:var(--panel);padding:4px 0 8px;z-index:2}
.modal-h h3{font-size:16px;font-weight:600}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modal-in{border-radius:16px}}

.pill{display:inline-flex;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:var(--bg2);font-size:12px;cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--amber)}
.pill.on{background:var(--amberdim);border-color:var(--amber);color:var(--amber2)}

.empty{text-align:center;padding:36px 16px;color:var(--faint)}
.empty div:first-child{font-size:34px;margin-bottom:10px;opacity:.5}

details{border:1px solid var(--line);border-radius:var(--rs);margin-bottom:8px;background:var(--bg2);overflow:hidden}
details>summary{padding:11px 13px;cursor:pointer;font-size:13.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"+";color:var(--amber);font-size:17px;flex-shrink:0}
details[open]>summary:after{content:"−"}
details>summary:hover{background:rgba(255,255,255,.03)}
.dbody{padding:0 13px 13px;font-size:13px;line-height:1.65;color:rgba(240,238,230,.82)}
.dbody h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:12px 0 5px}

.kvchart td{padding:4px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.warn-inline{color:#e8877f;font-size:11.5px}

/* ---------- VISITE FILMÉE / MODE GUIDÉ ---------- */
.camwrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line2)}
.camwrap video{width:100%;display:block;max-height:58dvh;object-fit:cover;background:#000}
.camhud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(rgba(0,0,0,.6),transparent);font-size:12px}
.recdot{width:9px;height:9px;border-radius:50%;background:#d4574e;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.camfoot{position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;gap:10px;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.bigrec{width:66px;height:66px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:#d4574e;cursor:pointer;flex-shrink:0;transition:.15s}
.bigrec.stop{background:#fff;border-radius:16px;width:56px;height:56px}
.bigrec:active{transform:scale(.93)}
.shot{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;font-size:19px;cursor:pointer;flex-shrink:0}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:thin}
.strip figure{position:relative;flex:0 0 74px}
.strip img{width:74px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line2);display:block}
.strip .kill{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:50%;background:var(--bad);color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer}
.strip .star{position:absolute;bottom:2px;left:3px;font-size:10px;text-shadow:0 1px 3px #000}
.live{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;font-size:12.5px;line-height:1.6;max-height:130px;overflow-y:auto;color:rgba(240,238,230,.8)}
.live i{color:var(--faint);font-style:normal}

.parc{display:grid;gap:10px}
.pcard{display:flex;gap:13px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;transition:.15s;text-align:left;width:100%;font-family:inherit;color:inherit}
.pcard:hover{border-color:var(--line2);background:var(--panel2)}
.pcard.done{border-color:rgba(78,168,106,.4)}
.pcard.now{border-color:var(--amber);box-shadow:0 0 0 1px rgba(224,165,61,.25)}
.pcard.lock{opacity:.42;cursor:not-allowed}
.pnum{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
.pcard.done .pnum{background:var(--okdim);border-color:rgba(78,168,106,.5);color:#7fd398}
.pcard.now .pnum{background:var(--amber);border-color:var(--amber);color:#171712}
.pbody b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.pbody span{font-size:12.5px;color:var(--muted);line-height:1.5;display:block}
.pbody em{font-style:normal;font-size:11.5px;color:var(--amber2);display:block;margin-top:5px}

.qbox{border:1px solid var(--line2);border-radius:var(--r);padding:18px;background:var(--panel);margin-bottom:12px}
.qbox h3{font-size:17px;line-height:1.35;color:var(--txt);text-transform:none;letter-spacing:0;margin:0 0 8px}
.qwhy{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line2);padding-left:10px;margin-bottom:14px;line-height:1.55}
.qopt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--bg2);margin-bottom:8px;cursor:pointer;font-size:14px;transition:.15s;font-family:inherit;color:inherit}
.qopt:hover{border-color:var(--amber);background:var(--panel2)}
.qopt.on{border-color:var(--amber);background:var(--amberdim);color:var(--amber2)}
.qprog{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}

/* ---------- IMPRESSION ---------- */
@media print{
  body{background:#fff;color:#111;font-size:11px}
  .topbar,nav.tabs,.wizbar,.noprint,.btn{display:none!important}
  main{padding:0;max-width:none}
  .view{display:none!important}
  .view.on{display:block!important}
  .card{border:1px solid #bbb;background:#fff;color:#111;break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
  .card h2,.card h3,.sectitle{color:#111}
  table{min-width:0}
  th{color:#333;border-bottom:1px solid #666}
  td{border-bottom:1px solid #ddd}
  .kpi{border:1px solid #bbb}
  .kpi .k,.sub,.hint{color:#555}
  .kpi .v{color:#111!important}
  .tag{border-color:#999;color:#333}
  .note{background:#f5f5f5;border-color:#999;color:#111}
  a{color:#111;text-decoration:none}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar noprint">
    <div class="topbar-in">
      <div class="brand">
        <b>ÉQUILIBRAGE<em>·</em>PRO</b>
        <span id="brandSub">Assistant d'équilibrage hydraulique</span>
      </div>
      <button class="iconbtn" id="btnIA" title="Assistant IA" style="border-color:rgba(224,165,61,.45);background:var(--amberdim)">✨</button>
      <button class="iconbtn" id="btnSave" title="Enregistrer">💾</button>
      <button class="iconbtn" id="btnMenu" title="Menu projet">⋯</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main>
    <section class="view" id="v-parcours"></section>
    <section class="view" id="v-visite"></section>
    <section class="view" id="v-projet"></section>
    <section class="view" id="v-reseau"></section>
    <section class="view" id="v-debits"></section>
    <section class="view" id="v-vannes"></section>
    <section class="view" id="v-equilibrage"></section>
    <section class="view" id="v-outils"></section>
    <section class="view" id="v-ecs"></section>
    <section class="view" id="v-rapport"></section>
    <section class="view" id="v-ia"></section>
    <section class="view" id="v-aide"></section>
  </main>

  <div class="wizbar noprint" id="wizbar" style="display:none">
    <div class="wizbar-in" id="wizbarIn"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-in" id="modalIn"></div></div>

<script>
"use strict";
/* =========================================================================
   ÉQUILIBRAGE PRO — Assistant d'équilibrage hydraulique
   Application autonome (aucune dependance serveur, données en localStorage)

/* -------------------------------------------------------------------------

/* -------------------------------------------------------------------------
   4. FLUIDES ET FORMULES HYDRAULIQUES
   ------------------------------------------------------------------------- */
/* Proprietes approchees à température moyenne de réseau.
   rho en kg/m3, cp en kJ/(kg.K), d = densité relative (pour la correction dp),
   nu = viscosité relative à l'eau (indicative, pour alerte de correction).     */
const FLUIDES = {
 eau:      {nom:"Eau",                       rho:983,  cp:4.185, d:0.983, nu:1.0},
 mpg20:    {nom:"Eau + MPG 20 % (propylène)",rho:1010, cp:4.00,  d:1.010, nu:1.6},
 mpg30:    {nom:"Eau + MPG 30 % (propylène)",rho:1020, cp:3.87,  d:1.020, nu:2.2},
 mpg40:    {nom:"Eau + MPG 40 % (propylène)",rho:1030, cp:3.75,  d:1.030, nu:3.2},
 meg20:    {nom:"Eau + MEG 20 % (éthylène)", rho:1015, cp:3.95,  d:1.015, nu:1.4},
 meg30:    {nom:"Eau + MEG 30 % (éthylène)", rho:1030, cp:3.80,  d:1.030, nu:1.8},
 meg40:    {nom:"Eau + MEG 40 % (éthylène)", rho:1045, cp:3.65,  d:1.045, nu:2.4}
};

/* Q [l/h] à partir d'une puissance [kW] et d'un DT [K] */
function debitDepuisPuissance(kW, dt, fl){
  const f = FLUIDES[fl] || FLUIDES.eau;
  if(!(dt>0)) return 0;
  // Q[m3/h] = P[kW]*3600 / (rho*cp*DT)  ->  *1000 pour l/h
  return kW*3600*1000/(f.rho*f.cp*dt);
}
/* Puissance [kW] à partir d'un débit [l/h] et d'un DT [K] */
function puissanceDepuisDebit(lh, dt, fl){
  const f = FLUIDES[fl] || FLUIDES.eau;
  return lh/1000*f.rho*f.cp*dt/3600;
}
/* Relation de base utilisee partout :
      Q[l/h] = 100 * Kv * RAC( dp[kPa] / d )
   avec Kv en m3/h (débit sous 1 bar, eau) et d = densité relative du fluide.
   Kv [m3/h] déduit d'une mesure (dp + débit) : c'est ce calcul qui rend
   l'application utilisable sur N'IMPORTE QUELLE vanne, même sans abaque. */
function kvDepuisMesure(lh, dpkPa, fl){
  const f = FLUIDES[fl] || FLUIDES.eau;
  if(!(dpkPa>0) || !(lh>0)) return null;
  return lh/(100*Math.sqrt(dpkPa/f.d));
}
function debitDepuisKv(kv, dpkPa, fl){
  const f = FLUIDES[fl] || FLUIDES.eau;
  if(!(kv>0)||!(dpkPa>0)) return 0;
  return 100*kv*Math.sqrt(dpkPa/f.d);
}
function kvNecessaire(lh, dpkPa, fl){
  const f = FLUIDES[fl] || FLUIDES.eau;
  if(!(lh>0)||!(dpkPa>0)) return null;
  return lh/(100*Math.sqrt(dpkPa/f.d));
}
function dpDepuisKv(kv, lh, fl){
  const f = FLUIDES[fl] || FLUIDES.eau;
  if(!(kv>0)) return null;
  return Math.pow(lh/(100*kv),2)*f.d;
}
/* Vitesse [m/s] à partir d'un débit [l/h] et d'un diamètre intérieur [mm] */
function vitesse(lh, dint){
  if(!(dint>0)) return null;
  const s = Math.PI*Math.pow(dint/1000,2)/4;
  return (lh/1000/3600)/s;
}
/* Diamètre intérieur indicatif (acier noir tube soude, séries courantes) */
const DINT = {10:12.5,15:16.1,20:21.7,25:27.3,32:36.0,40:41.9,50:53.1,65:68.9,80:80.9,100:105.3,125:130.0,150:155.4,200:206.5,250:260.4,300:309.7,350:339.6,400:388.8};

/* Interpolation d'un abaque Kv : points [{p:position, kv:valeur}] */
function kvDepuisPosition(chart, pos){
  if(!chart || chart.length<2) return null;
  const c = chart.slice().sort((a,b)=>a.p-b.p);
  if(pos<=c[0].p) return c[0].kv;
  if(pos>=c[c.length-1].p) return c[c.length-1].kv;
  for(let i=0;i<c.length-1;i++){
    if(pos>=c[i].p && pos<=c[i+1].p){
      const t=(pos-c[i].p)/(c[i+1].p-c[i].p);
      // interpolation log-linéaire : les courbes Kv sont fortement non linéaires
      if(c[i].kv>0 && c[i+1].kv>0)
        return Math.exp(Math.log(c[i].kv)+t*(Math.log(c[i+1].kv)-Math.log(c[i].kv)));
      return c[i].kv+t*(c[i+1].kv-c[i].kv);
    }
  }
  return null;
}
function positionDepuisKv(chart, kv){
  if(!chart || chart.length<2 || !(kv>0)) return null;
  const c = chart.slice().sort((a,b)=>a.p-b.p);
  if(kv<=c[0].kv) return c[0].p;
  if(kv>=c[c.length-1].kv) return c[c.length-1].p;
  for(let i=0;i<c.length-1;i++){
    const a=c[i], b=c[i+1];
    if((kv>=a.kv&&kv<=b.kv)||(kv<=a.kv&&kv>=b.kv)){
      if(a.kv>0&&b.kv>0&&a.kv!==b.kv){
        const t=(Math.log(kv)-Math.log(a.kv))/(Math.log(b.kv)-Math.log(a.kv));
        return a.p+t*(b.p-a.p);
      }
      return a.p;
    }
  }
  return null;
}

function enfants(id){ return P.nodes.filter(n=>n.parent===id); }
function noeud(id){ return P.nodes.find(n=>n.id===id); }
function racines(){ return P.nodes.filter(n=>!n.parent); }
function chemin(id){
  const out=[]; let n=noeud(id);
  while(n){ out.unshift(n); n = n.parent?noeud(n.parent):null; }
  return out;
}
function supprimerNoeud(id){
  const kill=[id]; 
  for(let i=0;i<kill.length;i++) enfants(kill[i]).forEach(c=>kill.push(c.id));
  P.nodes = P.nodes.filter(n=>!kill.includes(n.id));
  autosave();
}
function ajouterNoeud(parent, type, nom){
  const n = {id:uid(), parent:parent, type:type, nom:nom||TYPES[type].nom, open:true};
  if(type==="reseau"){ n.mode="radiateurs"; n.dtNom=20; n.tDep=70; }
  if(type==="terminal"){ n.calc={mode:"puissance", kW:1, dt:20}; }
  P.nodes.push(n); autosave(); return n;
}

/* débit nominal d'un noeud : saisi, calculé, ou somme des enfants */
function debitNominal(n){
  if(!n) return 0;
  const kids = enfants(n.id);
  if(kids.length && !n.forceDebit) return kids.reduce((s,k)=>s+debitNominal(k),0);
  const c = n.calc||{};
  const fl = P.fluide;
  if(c.mode==="debit")      return +c.lh||0;
  if(c.mode==="puissance")  return debitDepuisPuissance(+c.kW||0, +c.dt||20, fl);
  if(c.mode==="deperdition"){
    const w = (+c.longueur||0)*(+c.wparm||0);         /* W */
    return debitDepuisPuissance(w/1000, +c.dtBoucle||5, fl);
  }
  return +c.lh||0;
}
/* dernière mesure enregistrée */
function derniereMesure(n){
  if(!n || !n.mesures || !n.mesures.length) return null;
  return n.mesures[n.mesures.length-1];
}
function lambda(n){
  const m = derniereMesure(n); const qn = debitNominal(n);
  if(!m || !(qn>0) || !(m.q>0)) return null;
  return m.q/qn;
}
/* tous les noeuds "reglables" enfants directs d'un groupe */
function membresGroupe(id){ return enfants(id).filter(n=>n.type!=="chaufferie"); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fx(v,d){ if(v==null||isNaN(v)||!isFinite(v)) return "—"; return Number(v).toLocaleString("fr-FR",{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d}); }
function pct(v){ if(v==null||isNaN(v)) return "—"; return (v>0?"+":"")+fx(v*100,1)+" %"; }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.from((r||document).querySelectorAll(s)); }

let flashT=null;
function flash(msg, bad){
  let el = $("#flash");
  if(!el){ el=document.createElement("div"); el.id="flash";

    document.body.appendChild(el); }
  el.textContent=msg;
  el.style.background = bad? "#4a1f1c":"#233021";
  el.style.border = "1px solid "+(bad?"#d4574e":"#4ea86a");

function closeModal(){ $("#modal").classList.remove("on"); }

function ecartTag(q, qn, tol){
  if(!(qn>0)||q==null) return '<span class="tag">non mesure</span>';
  const e=(q-qn)/qn;
  const a=Math.abs(e)*100;
  if(a<=tol) return '<span class="tag ok">'+pct(e)+'</span>';
  if(a<=tol*2) return '<span class="tag warn">'+pct(e)+'</span>';
  return '<span class="tag bad">'+pct(e)+'</span>';
}
function valveOf(n){ return n && n.valve ? VALVES.find(v=>v.id===n.valve.id) : null; }
function chartKey(n){ return n&&n.valve ? n.valve.id+"|"+(n.valve.dn||"") : null; }
function chartOf(n){
  if(!n||!n.valve) return null;
  if(n.valve.chart && n.valve.chart.length>=2) return n.valve.chart;
  const k=chartKey(n);
  return (k && CHARTS[k] && CHARTS[k].length>=2) ? CHARTS[k] : null;
}

function ficheInstrument(i){

function load2(){ P = DB.projets.find(x=>x.id===DB.courant)||null; }

function exportJSON(){
  const data = JSON.stringify({projet:P, charts:CHARTS}, null, 2);
  const b = new Blob([data],{type:"application/json"});
  const a = document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download = "equilibrage_"+(P.nom||"chantier").replace(/[^a-z0-9]+/gi,"_")+".json";
  a.click(); URL.revokeObjectURL(a.href); flash("Fichier exporté");
}
function importJSON(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(d.projet){ d.projet.id=uid(); DB.projets.push(d.projet); DB.courant=d.projet.id; P=d.projet; }
      if(d.charts) CHARTS=Object.assign(CHARTS,d.charts);
      autosave(); flash("Chantier importé"); go("reseau");
    }catch(e){ flash("Fichier illisible",true); } };
    r.readAsText(f); };
  inp.click();
}

function nodeHTML(n){

  return `<div class="tnode">
    <div class="tnode-h" data-edit="${n.id}">
      ${kids.length? `<span class="chev ${n.open?"open":""}" data-tog="${n.id}">▶</span>`:'<span style="width:11px"></span>'}
      <div class="tnode-ic">${T.ic}</div>
      <div class="tnode-t"><b>${esc(n.nom)}</b><small>${T.nom}${n.mode?" · "+MODES_RESEAU[n.mode]:""}${v?" · "+esc(v.modele)+(n.valve.dn?" DN"+n.valve.dn:""):""}</small></div>
      <div style="text-align:right;flex-shrink:0">
        <div class="mono" style="font-size:12px">${q>0?fx(q,0)+" l/h":"—"}</div>

/* --- bloc DÉBIT dans la fiche d'un noeud --- */
function boxDebit(n){
  const box=$("#debitBox"); if(!box) return;
  const kids=enfants(n.id);
  const c=n.calc||(n.calc={mode:"puissance",kW:1,dt:20});
  const par = chemin(n.id).find(x=>x.type==="reseau");
  const dtDef = par? (par.dtNom||20):20;
  if(kids.length && !n.forceDebit){
    box.innerHTML=`<h3 style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:16px 0 8px">Débit nominal</h3>
      <div class="kpi hi"><div class="k">Somme des ${kids.length} éléments</div><div class="v">${fx(debitNominal(n),0)}<span class="u"> l/h</span></div></div>
      <label class="f" style="margin-top:10px"><span><input type="checkbox" id="fd"> Forcer un débit différent de la somme</span></label>`;
    $("#fd").onchange=()=>{n.forceDebit=true;autosave();boxDebit(n);};
    return;
  }
  box.innerHTML=`<h3 style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:16px 0 8px">Débit nominal</h3>
   <div class="row" style="margin-bottom:10px">
     <span class="pill${c.mode==="puissance"?" on":""}" data-m="puissance">Par la puissance</span>
     <span class="pill${c.mode==="debit"?" on":""}" data-m="debit">Débit direct</span>
     <span class="pill${c.mode==="deperdition"?" on":""}" data-m="deperdition">Boucle ECS</span>
   </div>
   <div id="dfields"></div>
   <div class="kpi hi" style="margin-top:10px"><div class="k">Débit nominal retenu</div><div class="v" id="dres">—</div></div>
   ${kids.length?'<label class="f" style="margin-top:10px"><span><input type="checkbox" id="fd2" checked> Débit force (décocher pour reprendre la somme des enfants)</span></label>':""}`;
  $$("[data-m]").forEach(p=>p.onclick=()=>{c.mode=p.dataset.m;autosave();boxDebit(n);});
  const F=$("#dfields");
  if(c.mode==="puissance"){
    F.innerHTML=`<div class="grid g2">
      <label class="f"><span>Puissance de l'émetteur (kW)</span><input type="number" step="0.1" id="c_kw" value="${c.kW||0}"></label>
      <label class="f"><span>DT départ / retour (K)</span><input type="number" step="0.5" id="c_dt" value="${c.dt||dtDef}"></label></div>
      <div class="hint">Q (l/h) = P(kW) x 3600 x 1000 / (rho x cp x DT). Pour l'eau à 60 °C cela revient à environ <b>860 x P / DT</b>.</div>`;
    $("#c_kw").oninput=upd; $("#c_dt").oninput=upd;
  } else if(c.mode==="debit"){
    F.innerHTML=`<label class="f"><span>Débit nominal (l/h)</span><input type="number" id="c_lh" value="${c.lh||0}"></label>
      <div class="hint">Saisir directement la valeur du CCTP, de la note de calcul ou de l'abaque constructeur de l'émetteur.</div>`;
    $("#c_lh").oninput=upd;
  } else {
    F.innerHTML=`<div class="grid g2">
      <label class="f"><span>Longueur de la colonne aller + retour (m)</span><input type="number" id="c_lg" value="${c.longueur||0}"></label>
      <label class="f"><span>Déperdition linéaire (W/m)</span><input type="number" step="0.5" id="c_wm" value="${c.wparm||10}"></label>
      <label class="f"><span>DT admis sur la boucle (K)</span><input type="number" step="0.5" id="c_dtb" value="${c.dtBoucle||5}"></label></div>
      <div class="hint">Déperdition linéaire indicative pour un tube calorifuge en ECS : <b>7 à 12 W/m</b> selon le diamètre et l'épaisseur d'isolant ; <b>25 à 45 W/m</b> pour un tube NON calorifuge. Le DT de boucle est généralement limite à <b>5 K</b> pour garantir 50 °C en tout point avec un départ à 55 °C.</div>`;
    $("#c_lg").oninput=upd; $("#c_wm").oninput=upd; $("#c_dtb").oninput=upd;
  }
  if($("#fd2")) $("#fd2").onchange=e=>{ n.forceDebit=e.target.checked; autosave(); boxDebit(n); };
  upd();
  function upd(){
    if($("#c_kw")) c.kW=+$("#c_kw").value||0;
    if($("#c_dt")) c.dt=+$("#c_dt").value||0;
    if($("#c_lh")) c.lh=+$("#c_lh").value||0;
    if($("#c_lg")) c.longueur=+$("#c_lg").value||0;
    if($("#c_wm")) c.wparm=+$("#c_wm").value||0;
    if($("#c_dtb")) c.dtBoucle=+$("#c_dtb").value||0;
    autosave();
    const q=debitNominal(n);
    const d=$("#dres"); if(d) d.innerHTML=fx(q,0)+'<span class="u"> l/h</span>';
  }
}

/* --- bloc VANNE dans la fiche d'un noeud --- */
function boxVanne(n){
  const box=$("#valveBox"); if(!box) return;
  const v = n.valve? VALVES.find(x=>x.id===n.valve.id):null;
  box.innerHTML=`<h3 style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:16px 0 8px">Organe de réglage</h3>
   <div class="grid g2">
     <label class="f"><span>Vanne</span><select id="v_id"><option value="">— aucune —</option>${
        Object.keys(CAT).map(k=>`<optgroup label="${CAT[k].nom}">${VALVES.filter(x=>x.cat===k).map(x=>`<option value="${x.id}"${n.valve&&n.valve.id===x.id?" selected":""}>${esc(x.marque)} ${esc(x.modele)}</option>`).join("")}</optgroup>`).join("")}
     </select></label>
     <label class="f"><span>Diamètre</span><select id="v_dn">${v? v.dn.map(d=>`<option value="${d}"${n.valve.dn==d?" selected":""}>DN ${d}</option>`).join(""):'<option value="">—</option>'}</select></label>
   </div>
   <div id="vInfo"></div>`;
  $("#v_id").onchange=e=>{
    if(!e.target.value){ delete n.valve; }
    else{
      const vv=VALVES.find(x=>x.id===e.target.value);
      n.valve={id:vv.id, dn:vv.dn[Math.min(1,vv.dn.length-1)], pos:null};
    }
    autosave(); boxVanne(n);
  };
  if($("#v_dn")) $("#v_dn").onchange=e=>{ n.valve.dn=+e.target.value; autosave(); boxVanne(n); };
  const I=$("#vInfo");
  if(!v){ I.innerHTML='<div class="note d">Sans organe de réglage, ce point ne peut pas être équilibré. Si le réseau n\'en comporte pas, choisir <b>Générique › Te de réglage sans prise de pression</b> : l\'application proposera alors les méthodes alternatives (ultrason, température).</div>'; return; }
  const badge = {verifie:'<span class="tag ok">données vérifiées</span>', partiel:'<span class="tag warn">abaque à confirmer</span>', asaisir:'<span class="tag bad">abaque à saisir</span>'}[v.conf];
  const ch=chartOf(n);
  I.innerHTML=`<div class="note ${v.cat==="statique"||v.cat==="venturi"?"":"i"}">
     <b>${esc(v.marque)} ${esc(v.modele)}</b> ${badge}<br>
     <span style="color:var(--faint)">${esc(CAT[v.cat].nom)}</span>
     <div style="margin-top:6px">${esc(CAT[v.cat].desc)}</div>
     <div style="margin-top:8px"><b>Réglage :</b> ${esc(v.reglage)}</div>
     <div style="margin-top:6px"><b>Mesure :</b> ${esc(v.dpMes)}</div>
     ${v.dpMin?`<div style="margin-top:6px"><b>dp de référence :</b> ${v.dpMin} kPa ${v.cat==="statique"||v.cat==="venturi"?"(dp minimal conseillé pour une mesure fiable)":"(dp minimal de fonctionnement)"}</div>`:""}
     ${v.kvsRef&&v.kvsRef[n.valve.dn]?`<div style="margin-top:6px"><b>Kvs constructeur DN${n.valve.dn} :</b> ${v.kvsRef[n.valve.dn]} m³/h</div>`:""}
   </div>
   <div class="row">
     <button class="btn sm" id="v_chart">${ch?"✎ Modifier l'abaque Kv ("+ch.length+" points)":"+ Saisir l'abaque Kv du constructeur"}</button>
     <button class="btn sm" id="v_fiche">📖 Fiche technique complète</button>
   </div>
   ${ch?'<div class="note g" style="margin-top:8px">Abaque disponible : l\'application peut convertir directement un débit cible en <b>position de volant</b>.</div>':'<div class="note" style="margin-top:8px">Pas d\'abaque saisi. Ce n\'est <b>pas bloquant</b> : l\'application déduit le Kv réel de chaque mesure (Kv = Q / (100 x RAC(dp))) et pilote l\'équilibrage par la mesure.</div>'}`;
  $("#v_chart").onclick=()=>editChart(n);
  $("#v_fiche").onclick=()=>{ openModal(ficheVanneHTML(v)+'<button class="btn wide" style="margin-top:12px" onclick="closeModal()">Fermer</button>'); };
}

/* --- editeur d'abaque Kv (position -> Kv) --- */
function editChart(n){
  const v=VALVES.find(x=>x.id===n.valve.id);
  const key=chartKey(n);
  let pts = (chartOf(n)||[]).slice();
  if(!pts.length){
    const mx = v.posMax|| v.tours || 4;
    for(let i=1;i<=Math.round(mx);i++) pts.push({p:i, kv:null});
  }
  draw();
  function draw(){
    openModal(`<div class="modal-h"><div><h3>Abaque Kv — ${esc(v.marque)} ${esc(v.modele)} DN${n.valve.dn}</h3>
      <small style="color:var(--faint)">Saisir les couples (position de volant ; Kv) lus sur la notice</small></div>
      <button class="iconbtn" onclick="closeModal()">✕</button></div>
     <div class="note i">Où trouver ces valeurs ? Dans la <b>notice de la vanne</b> (tableau "Kv en fonction du préréglage"), ou sur l'abaque débit/dp du constructeur. Si vous n'avez qu'un abaque graphique : lisez un point (débit ; dp) pour une position donnée et calculez Kv = Q(l/h) / (100 x RAC(dp en kPa)). L'outil de conversion est dans l'onglet <b>Outils</b>.</div>
     <div class="tbl-wrap"><table class="kvchart"><thead><tr><th>Position (${esc(v.posLabel||"tours")})</th><th>Kv (m³/h)</th><th></th></tr></thead>
     <tbody>${pts.map((pt,i)=>`<tr>
       <td><input type="number" step="0.1" data-p="${i}" value="${pt.p==null?"":pt.p}"></td>
       <td><input type="number" step="0.01" data-k="${i}" value="${pt.kv==null?"":pt.kv}"></td>
       <td><button class="btn xs dgr" data-x="${i}">✕</button></td></tr>`).join("")}</tbody></table></div>
     <div class="row" style="margin-top:10px">
       <button class="btn sm" id="addPt">+ Ligne</button>
       <button class="btn sm pri" id="savePt">Enregistrer l'abaque</button>
       <button class="btn sm dgr" id="delPt">Effacer</button>
     </div>
     <div class="hint" style="margin-top:8px">L'abaque est mémorisé pour <b>toutes</b> les vannes de ce modèle et de ce DN dans tous vos chantiers. Vous ne le saisissez qu'une fois.</div>`);
    $$("[data-p]").forEach(i=>i.oninput=()=>{pts[+i.dataset.p].p=+i.value;});
    $$("[data-k]").forEach(i=>i.oninput=()=>{pts[+i.dataset.k].kv=+i.value;});
    $$("[data-x]").forEach(b=>b.onclick=()=>{pts.splice(+b.dataset.x,1);draw();});
    $("#addPt").onclick=()=>{pts.push({p:(pts.length?Math.max(...pts.map(x=>x.p||0))+1:1),kv:null});draw();};
    $("#delPt").onclick=()=>{ delete CHARTS[key]; autosave(); closeModal(); boxVanne(n); flash("Abaque effacé"); };
    $("#savePt").onclick=()=>{
      const clean=pts.filter(x=>x.p!=null&&x.kv>0).sort((a,b)=>a.p-b.p);
      if(clean.length<2){ flash("Il faut au moins 2 points valides",true); return; }
      CHARTS[key]=clean; autosave(); closeModal(); boxVanne(n); flash("Abaque enregistré ("+clean.length+" points)");
    };
  }
}

   ------------------------------------------------------------------------- */
function vDebits(){
  const el=$("#v-debits");
  if(!P.nodes.length){ el.innerHTML='<div class="empty"><div>💧</div>Construisez d\'abord le réseau.</div>'; return; }
  const terms = P.nodes.filter(n=>n.type==="terminal");
  const total = racines().reduce((s,n)=>s+debitNominal(n),0);
  el.innerHTML=`
  <div class="card">
    <h2>💧 Débits nominaux</h2>
    <p class="sub">Le débit de consigne de chaque point. C'est la donnée la plus critique de tout l'équilibrage : une consigne fausse et le réglage le plus soigné ne sert à rien.</p>
    <div class="grid g3">
      <div class="kpi hi"><div class="k">Débit total installation</div><div class="v">${fx(total,0)}<span class="u"> l/h</span></div></div>
      <div class="kpi"><div class="k">Émetteurs</div><div class="v">${terms.length}</div></div>
      <div class="kpi"><div class="k">Puissance équivalente</div><div class="v">${fx(puissanceDepuisDebit(total, moyDT(), P.fluide),1)}<span class="u"> kW</span></div></div>
    </div>
  </div>
  <div class="card">
    <h3>Saisie rapide</h3>
    <p class="sub">Modifiable directement dans le tableau. La colonne "vitesse" alerte sur les diamètres inadaptés.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Repère</th><th>Type</th><th class="num">Puissance kW</th><th class="num">DT K</th><th class="num">Débit l/h</th><th class="num">DN</th><th class="num">Vitesse m/s</th></tr></thead>
      <tbody>${P.nodes.filter(n=>n.type!=="chaufferie").map(n=>ligneDebit(n)).join("")}</tbody>
    </table></div>
    <div class="hint" style="margin-top:10px">Vitesses usuelles : <b>0,3 à 1,0 m/s</b> sur une antenne terminale, <b>1,0 à 2,0 m/s</b> en distribution, jusqu'à <b>2,5-3 m/s</b> sur un collecteur principal. Au-delà : bruit et érosion. En cuivre sur ECS, rester sous <b>1,0 m/s</b> pour limiter l'érosion-corrosion.</div>
  </div>
  <div class="card">
    <h3>Application groupée</h3>
    <div class="grid g2">
      <label class="f"><span>Appliquer un DT à tous les émetteurs (K)</span><input type="number" id="mass_dt" step="0.5" value="${moyDT()}"></label>
      <div style="display:flex;align-items:flex-end"><button class="btn wide" id="mass_go">Appliquer</button></div>
    </div>
  </div>`;
  $$("[data-dn]",el).forEach(s=>s.onchange=()=>{ const n=noeud(s.dataset.dn); if(n.valve){n.valve.dn=+s.value;} else {n.dnTube=+s.value;} autosave(); render(); });
  /* onchange (et non oninput) : le tableau se recalculé à la sortie du champ,
     sinon le re-rendu ferait perdre le focus à chaque frappe. */
  $$("[data-kw]",el).forEach(i=>i.onchange=()=>{ const n=noeud(i.dataset.kw); n.calc=n.calc||{mode:"puissance"}; n.calc.mode="puissance"; n.calc.kW=+i.value||0; autosave(); render(); });
  $$("[data-dt]",el).forEach(i=>i.onchange=()=>{ const n=noeud(i.dataset.dt); n.calc=n.calc||{mode:"puissance"}; n.calc.dt=+i.value||0; autosave(); render(); });
  $$("[data-lh]",el).forEach(i=>i.onchange=()=>{ const n=noeud(i.dataset.lh); n.calc=n.calc||{}; n.calc.mode="debit"; n.calc.lh=+i.value||0; n.forceDebit=true; autosave(); render(); });
  $("#mass_go").onclick=()=>{ const d=+$("#mass_dt").value||20;
    P.nodes.filter(n=>n.type==="terminal").forEach(n=>{ n.calc=n.calc||{mode:"puissance"}; n.calc.dt=d; });
    autosave(); render(); flash("DT appliqué à tous les émetteurs"); };
}
function moyDT(){
  const r=P.nodes.filter(n=>n.type==="reseau");
  if(r.length) return r.reduce((s,x)=>s+(x.dtNom||20),0)/r.length;
  return 20;
}
function ligneDebit(n){
  const kids=enfants(n.id).length;
  const c=n.calc||{};
  const q=debitNominal(n);
  const dn = n.valve? n.valve.dn : (n.dnTube||null);
  const vv = dn? vitesse(q, DINT[dn]) : null;
  const vTag = vv==null? "—" : (vv>2.5? '<span class="tag bad">'+fx(vv,2)+'</span>' : vv>1.5? '<span class="tag warn">'+fx(vv,2)+'</span>' : '<span class="tag ok">'+fx(vv,2)+'</span>');
  const dnOpts = [10,15,20,25,32,40,50,65,80,100,125,150,200,250,300].map(d=>`<option value="${d}"${dn==d?" selected":""}>${d}</option>`).join("");
  const ind = "&nbsp;".repeat((chemin(n.id).length-1)*3);
  return `<tr>
   <td>${ind}${TYPES[n.type].ic} ${esc(n.nom)}</td>
   <td style="color:var(--faint);font-size:11px">${TYPES[n.type].nom}</td>
   <td class="num">${kids&&!n.forceDebit?"—":`<input type="number" step="0.1" style="width:76px" data-kw="${n.id}" value="${c.kW||""}">`}</td>
   <td class="num">${kids&&!n.forceDebit?"—":`<input type="number" step="0.5" style="width:62px" data-dt="${n.id}" value="${c.dt||""}">`}</td>
   <td class="num">${kids&&!n.forceDebit? '<b class="mono">'+fx(q,0)+'</b>' : `<input type="number" style="width:84px" data-lh="${n.id}" value="${fx(q,0).replace(/\s/g,"")}">`}</td>
   <td class="num"><select data-dn="${n.id}" style="width:74px"><option value="">—</option>${dnOpts}</select></td>
   <td class="num">${vTag}</td>
  </tr>`;
}

    ${dpc<3?'<div class="note d">Attention : le dp attendu sur la vanne sera inférieur à 3 kPa. La mesure de contrôle sera peu fiable. Envisagez une vanne d\'un DN inférieur ou un contrôle au débitmètre à ultrasons.</div>':""}`;
  };
  const gcalc=()=>{

      }).join("")}</tbody></table></div>
      <div class="hint" style="margin-top:8px">Le facteur de correction des pertes de charge est indicatif (effet combine densité/viscosité en régime turbulent). Pour un dimensionnement précis, utilisez les abaques du fabricant d'antigel.</div>`;
  };

  $$("[data-diag]",el).forEach(b=>b.onclick=()=>{

    aiDemander("Sur mon réseau je constate ce symptôme : « "+d.sym+" ». Analyse mes données, dis-moi la cause la plus probable dans MON cas précis, et donne-moi la marche à suivre.", "controle");
  });

/* -------------------------------------------------------------------------
   13. VUE — ÉQUILIBRAGE (assistant pas à pas)
   ------------------------------------------------------------------------- */

/* Un "groupe" = un noeud dont les enfants portent des organes de réglage.
   L'équilibrage se fait du niveau le PLUS PROFOND vers le plus général.       */
function groupes(){
  return P.nodes
    .filter(n=>{ const k=membresGroupe(n.id); return k.length>=1 && k.some(x=>x.valve); })
    .map(n=>({node:n, prof:chemin(n.id).length, membres:membresGroupe(n.id)}))
    .sort((a,b)=> b.prof-a.prof || a.node.nom.localeCompare(b.node.nom));
}
function etatGroupe(g){
  const m=g.membres.filter(x=>x.valve);
  const mes=m.filter(x=>derniereMesure(x)).length;
  const ok=m.filter(x=>{ const l=lambda(x); return l!=null && Math.abs(l-1)*100<= (x.type==="terminal"?P.tolTerm:P.tolAnt); }).length;
  if(g.node.equilibre) return {k:"done", lab:"termine", tag:"ok", n:m.length, mes, ok};
  if(!mes) return {k:"todo", lab:"à faire", tag:"", n:m.length, mes, ok};
  if(ok===m.length) return {k:"done", lab:"équilibré", tag:"ok", n:m.length, mes, ok};
  return {k:"wip", lab:"en cours", tag:"warn", n:m.length, mes, ok};
}

    ${chkOK?'<div class="note g">Contrôles préalables valides. Vous pouvez démarrer.</div>':'<div class="note d"><b>Contrôles préalables incomplets.</b> Une pompe non figée, un by-pass ouvert ou un filtre colmaté rendent toutes les mesures inexploitables. Complétez la checklist dans l\'onglet Chantier.</div>'}
  </div>
  ${gs.length? gs.map((g,i)=>{
    const s=etatGroupe(g);
    const par = g.node;
    return `<div class="card tight">

        </div>

          <span class="tag ${s.tag}">${s.lab}</span><br>

        </div>

   :'<div class="empty"><div>⚖️</div>Aucun groupe à équilibrer.<br><small>Ajoutez des éléments et affectez-leur des vannes de réglage.</small></div>'}
  ${(()=>{ const tous=gs.length&&gs.every(g=>etatGroupe(g).k==="done");
    return `<div class="card"${tous?"":' style="opacity:.55"'}>
      <h2>🏁 Dernière étape — mise en service</h2>
      <p class="sub">${tous?"Tous les groupes sont équilibrés. C'est ici que se joue l'économie d'énergie.":"Disponible une fois tous les groupes équilibrés."}</p>
      <ol class="num">
        <li><b>Réduire la pompe.</b> Baisser la hauteur manométrique pas à pas en surveillant le débit du circuit le plus défavorisé. On s'arrete dès que ce circuit commence à perdre du débit, puis on remonte d'un cran. Une pompe réglée 30 % trop haut consomme environ deux fois plus.</li>
        <li><b>Repasser en pression différentielle variable</b> si le réseau comporte des vannes de régulation 2 voies ou des robinets thermostatiques (mode dp proportionnel). Sur un réseau à débit constant, rester en vitesse fixe.</li>
        <li><b>Reposer les têtes thermostatiques</b> et remettre la régulation en automatique.</li>
        <li><b>Rouvrir les vannes d'isolement</b> éventuellement fermées pendant l'intervention et re-purger.</li>
        <li><b>Contrôler le DT global</b> après 24 h de fonctionnement : c'est le vrai juge de paix. Un DT conforme au régime de conception valide l'équilibrage.</li>
