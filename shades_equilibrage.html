/* -------------------------------------------------------------------------
   TRANSCRIPTION AUDIO — l'audio de la visite est transcrit automatiquement
   -------------------------------------------------------------------------
   Le navigateur ne sait pas transcrire le son d'un fichier importé, et sa
   reconnaissance vocale écorche le vocabulaire technique. L'audio est donc
   envoyé à un service de transcription, avec le vocabulaire du métier en
   amorce. Contrainte : une fonction Netlify accepte un corps limité, donc
   l'audio est décodé, ramené en mono 16 kHz et découpé en tranches.
   ------------------------------------------------------------------------- */
const AUDIO_ENDPOINT_DEFAUT = "/.netlify/functions/transcribe";
function audioEndpoint(){ return localStorage.getItem("equilibrage_audio_endpoint") || AUDIO_ENDPOINT_DEFAUT; }
const AUDIO_TAUX   = 16000;   /* 16 kHz : le format attendu par les moteurs de transcription */
const AUDIO_TRANCHE= 60;      /* secondes par tranche envoyée                                */
const AUDIO_MAX_B64= 3.6e6;   /* garde-fou : au-delà, la fonction refuserait le corps         */

function wavBlob(f32, taux){
  const n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,taux,true); v.setUint32(28,taux*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40,n*2,true);
  let o=44;
  for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,f32[i])); v.setInt16(o, s<0? s*0x8000 : s*0x7fff, true); o+=2; }
  return new Blob([buf],{type:"audio/wav"});
}
function blobB64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]);
    r.onerror=()=>rej(new Error("Lecture du fichier audio impossible"));
    r.readAsDataURL(blob);
  });
}
/* Décode n'importe quelle source (blob enregistré ou fichier vidéo importé),
   la ramène en mono 16 kHz, et la découpe en tranches de 60 s.               */
async function audioTranches(source){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) throw new Error("Ce navigateur ne sait pas décoder l'audio.");
  const brut=await source.arrayBuffer();
  const ctx=new AC();
  let dec;
  try{ dec=await ctx.decodeAudioData(brut.slice(0)); }
  catch(e){ try{ ctx.close(); }catch(_){}
    throw new Error("Le son de ce fichier n'a pas pu être décodé par le navigateur."); }
  try{ ctx.close(); }catch(_){}
  if(!dec || !dec.duration) throw new Error("Aucun son exploitable dans ce fichier.");
  /* rééchantillonnage hors temps réel */
  let data, taux=AUDIO_TAUX;
  try{
    const off=new OfflineAudioContext(1, Math.ceil(dec.duration*AUDIO_TAUX), AUDIO_TAUX);
    const src=off.createBufferSource(); src.buffer=dec; src.connect(off.destination); src.start();
    data=(await off.startRendering()).getChannelData(0);
  }catch(e){
    /* certains navigateurs refusent un taux arbitraire : on garde le taux d'origine */
    data=dec.getChannelData(0); taux=dec.sampleRate;
  }
  const parTranche=Math.floor(taux*AUDIO_TRANCHE), out=[];
  for(let i=0;i<data.length;i+=parTranche) out.push(wavBlob(data.subarray(i,Math.min(i+parTranche,data.length)), taux));
  return out;
}
/* Amorce de vocabulaire envoyée au moteur de transcription : c'est elle qui
   évite « vanne stade » au lieu de STAD, ou « oven trop » au lieu d'Oventrop. */
function audioAmorce(){
  const v=visVocabulaire();
  return "Visite technique d'une installation de chauffage. Vocabulaire attendu : "
    + v.marques.join(", ") + ". Modèles : " + v.modeles.slice(0,40).join(", ")
    + ". Termes : " + v.termes.join(", ") + ".";
}
async function audioTranscrire(source, onProgres){
  const tranches=await audioTranches(source);
  const amorce=audioAmorce();
  const morceaux=[];
  for(let i=0;i<tranches.length;i++){
    if(onProgres) onProgres(i, tranches.length);
    const b64=await blobB64(tranches[i]);
    if(b64.length>AUDIO_MAX_B64) throw new Error("Tranche audio trop lourde, réduisez la durée de la visite.");
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(), 60000);
    let resp;
    try{
      resp=await fetch(audioEndpoint(),{method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({audio:b64, mime:"audio/wav", nom:"visite_"+(i+1), prompt:amorce}),
        signal:ctrl.signal});
    }catch(e){ clearTimeout(to);
      throw new Error(e.name==="AbortError"? "La transcription a mis trop de temps." : "Service de transcription injoignable."); }
    clearTimeout(to);
    const txt=await resp.text();
    let data=null; try{ data=JSON.parse(txt); }catch(e){}
    if(!resp.ok){
      const msg=(data&&data.error)||txt.slice(0,200);
      if(resp.status===404 || resp.status===405) throw new Error("__NON_DEPLOYE__");
      if(String(msg).includes("OPENAI_API_KEY")) throw new Error("__NON_CONFIGURE__");
      throw new Error(String(msg));
    }
    if(data && data.texte) morceaux.push(data.texte);
  }
  return morceaux.join(" ").trim();
}

/* ---------------- chaîne complète, automatique ----------------
   Après l'arrêt du film, plus rien n'est demandé à l'utilisateur jusqu'aux
   questions : son, transcription, correction du vocabulaire, lecture des
   images et synthèse s'enchaînent seuls. Chaque étape a un repli : si la
   transcription échoue, on garde ce que le navigateur a entendu ; s'il n'a
   rien entendu, on continue avec les seules images.                        */
async function visPipeline(){
  VIS.busy=true; VIS.erreur=""; VIS.avertAudio=""; VIS.phase="analyse"; vVisite();
  if(VIS.audioSource){
    try{
      VIS.etape="Transcription de ce que vous avez dit…"; VIS.progres=0.05; vVisite();
      const t=await audioTranscrire(VIS.audioSource,(i,n)=>{
        VIS.etape="Transcription "+(i+1)+" / "+n+"…"; VIS.progres=0.05+0.25*(i/n); vVisite();
      });
      if(t && t.length>3){ VIS.transcript=t; VIS.transcriptSource="service"; }
    }catch(e){
      VIS.transcriptSource = VIS.transcript? "navigateur" : "";
      VIS.avertAudio = (e.message==="__NON_CONFIGURE__")
        ? "La transcription automatique n'est pas activée : la variable OPENAI_API_KEY manque dans les réglages Netlify."
        : (e.message==="__NON_DEPLOYE__")
        ? "Le service de transcription n'est pas disponible sur ce site (fonction transcribe absente ou page ouverte hors du site déployé)."
        : "La transcription automatique a échoué : "+e.message;
    }
  } else if(VIS.transcript){ VIS.transcriptSource="navigateur"; }

  if(VIS.transcript && VIS.transcript.length>15 && VIS.transcriptSource!=="service"){
    try{
      VIS.etape="Correction du vocabulaire technique…"; VIS.progres=0.32; vVisite();
      await visCorriger(true);
    }catch(e){}
  }
  await visAnalyser(true);
}

/* ---------------- analyse ---------------- */
async function visAnalyser(enchaine){
  const sel=visSelection();
  if(!sel.length && !VIS.transcript && !VIS.notes){
    VIS.busy=false; VIS.phase="review";
    VIS.erreur="Il n'y a ni image ni commentaire à analyser. Filmez à nouveau, importez des photos, ou écrivez vos remarques.";
    vVisite(); return;
  }
  const base=enchaine?0.35:0, amp=enchaine?0.65:1;
  VIS.busy=true; if(!enchaine) VIS.erreur=""; VIS.phase="analyse"; VIS.observations=[]; VIS.progres=base;
  VIS.etape="Préparation des images…"; vVisite();
  try{
    /* --- lots d'images --- */
    const lots=[];
    for(let i=0;i<sel.length;i+=VIS_LOT) lots.push(sel.slice(i,i+VIS_LOT));
    for(let i=0;i<lots.length;i++){
      VIS.etape="Lecture des images "+(i*VIS_LOT+1)+" à "+Math.min((i+1)*VIS_LOT, sel.length)+" sur "+sel.length+"…";
      VIS.progres=base+amp*(i/(lots.length+1)); vVisite();
      const contenu=[];
      lots[i].forEach((f,j)=>{
        contenu.push({type:"text", text:"Image "+(i*VIS_LOT+j+1)+(f.manuelle?" (photo prise volontairement par l'intervenant, donc importante)":"")+" :"});
        contenu.push(imgBloc(f));
      });
      contenu.push({type:"text", text:"Décris précisément ce que tu vois sur ces images. Recopie tous les textes lisibles (plaques, marquages gravés sur les corps de vanne, étiquettes, valeurs des cadrans). N'invente rien."});
      const data=await aiRequete({model:"claude-sonnet-4-5", max_tokens:2000, system:VIS_ROLE,
        messages:[{role:"user", content:contenu}],
        tools:[OUTIL_OBS], tool_choice:{type:"tool", name:"noter_observations"}}, 60000);
      const obs=aiOutilResultat(data,"noter_observations");
      if(obs) VIS.observations.push(obs);
    }
    /* --- synthèse + questions --- */
    VIS.etape="Analyse d'ensemble et préparation des questions…"; VIS.progres=base+amp*(lots.length/(lots.length+1)); vVisite();
    const dit=(VIS.transcript||"").trim(), notes=(VIS.notes||"").trim();
    const resume=VIS.observations.map((o,i)=>
      "LOT "+(i+1)+"\n"+
      (o.elements||[]).map(e=>`- ${e.quoi} : ${e.detail} [${e.confiance||"?"}]`).join("\n")+
      ((o.texte_lu&&o.texte_lu.length)? "\nTextes lus : "+o.texte_lu.join(" | "):"")+
      ((o.remarques&&o.remarques.length)? "\nRemarques : "+o.remarques.join(" | "):"")
    ).join("\n\n");
    const msg=
`OBSERVATIONS TIRÉES DES IMAGES :
${resume||"(aucune image exploitable)"}

CE QUE L'INTERVENANT A DIT EN FILMANT :
${dit||"(rien enregistré)"}

NOTES ÉCRITES PAR L'INTERVENANT :
${notes||"(aucune)"}

BIBLIOTHÈQUE DE VANNES DE L'APPLICATION (identifiants utilisables) :
${VALVES.map(v=>`${v.id} = ${v.marque} ${v.modele} (${v.cat})`).join("\n")}

Fais la synthèse de l'installation, puis liste les questions indispensables pour pouvoir
construire le chantier et l'équilibrer. Ne pose pas de question dont la réponse figure
déjà ci-dessus.`;
    const data=await aiRequete({model:"claude-sonnet-4-5", max_tokens:4000, system:VIS_ROLE,
      messages:[{role:"user", content:msg}],
      tools:[OUTIL_SYNTH], tool_choice:{type:"tool", name:"preparer_le_chantier"}}, 60000);
    const syn=aiOutilResultat(data,"preparer_le_chantier");
    if(!syn) throw new Error("L'analyse n'a pas renvoyé de résultat exploitable. Réessayez.");
    VIS.synthese=syn;
    VIS.questions=(syn.questions||[]).slice(0,12);
    VIS.qIdx=0; VIS.reponses={};
    VIS.phase="synthese"; VIS.busy=false; VIS.progres=1; vVisite();
  }catch(e){
    VIS.busy=false; VIS.erreur=e.message; VIS.phase="review"; vVisite();
  }
}

/* ---------------- génération du chantier ---------------- */
async function visGenerer(){
  VIS.busy=true; VIS.erreur=""; VIS.etape="Construction du chantier…"; VIS.phase="generation"; vVisite();
  try{
    const qr=VIS.questions.map(q=>`- ${q.question}\n  Réponse : ${VIS.reponses[q.id]!=null&&VIS.reponses[q.id]!==""? VIS.reponses[q.id] : "non renseignée"}`).join("\n");
    const msg=
`SYNTHÈSE DE L'INSTALLATION :
${VIS.synthese.resume||""}
Type : ${VIS.synthese.type_installation||"non précisé"}

MATÉRIEL IDENTIFIÉ :
${(VIS.synthese.materiel_identifie||[]).map(m=>`- ${m.quoi} : ${m.detail} [${m.confiance||"?"}]`).join("\n")||"(aucun)"}

RÉPONSES DE L'INTERVENANT :
${qr||"(aucune)"}

CE QU'IL A DIT EN FILMANT :
${(VIS.transcript||"(rien)").slice(0,3000)}

NOTES ÉCRITES :
${(VIS.notes||"(aucune)").slice(0,2000)}

IDENTIFIANTS DE VANNES UTILISABLES :
${VALVES.map(v=>v.id).join(", ")}

Construis maintenant l'arborescence complète du chantier.
Règles :
- Une chaufferie à la racine, puis un ou plusieurs réseaux, puis les bâtiments ou colonnes,
  puis les émetteurs. Ne crée un niveau que s'il existe réellement.
- Si le nombre exact d'émetteurs n'est pas connu, crée les colonnes et laisse leurs émetteurs
  de côté plutôt que d'inventer : mets l'information en hypothèse.
- Renseigne les puissances et les DT seulement si tu les connais ou si l'intervenant les a données.
- Pour une vanne dont le modèle n'est pas certain, utilise gen-statique (vanne statique inconnue)
  ou gen-te (organe sans prise de pression), jamais une marque devinée.
- Liste explicitement tes hypothèses et les réserves à vérifier sur place.`;
    const data=await aiRequete({model:"claude-sonnet-4-5", max_tokens:4000, system:VIS_ROLE,
      messages:[{role:"user", content:msg}],
      tools:[OUTIL_PLAN], tool_choice:{type:"tool", name:"construire_le_chantier"}}, 60000);
    const plan=aiOutilResultat(data,"construire_le_chantier");
    if(!plan || !plan.noeuds || !plan.noeuds.length) throw new Error("Le chantier n'a pas pu être construit. Réessayez, ou construisez-le à la main dans l'onglet Réseau.");
    VIS.plan=plan; VIS.busy=false; VIS.phase="resultat"; vVisite();
  }catch(e){
    VIS.busy=false; VIS.erreur=e.message; VIS.phase="questions"; vVisite();
  }
}

/* ---------------- application du plan au projet ---------------- */
function visAppliquer(){
  const plan=VIS.plan; if(!plan) return;
  if(!P) nouveauProjet(plan.nom||"Chantier filmé");
  else if(P.nodes.length>1 && !confirm("Le chantier actuel contient déjà des éléments. Ils seront remplacés par ce que l'IA a construit. Continuer ?")) return;
  if(plan.nom) P.nom=plan.nom;
  if(plan.fluide && FLUIDES[plan.fluide]) P.fluide=plan.fluide;
  P.nodes=[];
  const TYPES_OK=["chaufferie","reseau","batiment","colonne","terminal"];
  const map={};
  /* 1er passage : création (les parents peuvent arriver après les enfants) */
  (plan.noeuds||[]).forEach(n=>{
    const type=TYPES_OK.includes(n.type)? n.type : "colonne";
    const node={id:uid(), parent:null, type:type, nom:String(n.nom||"Élément"), open:true};
    if(type==="reseau"){
      node.mode = MODES_RESEAU[n.mode_reseau]? n.mode_reseau : "radiateurs";
      node.dtNom = +n.dt>0? +n.dt : 20;
      node.tDep  = +n.t_depart>0? +n.t_depart : 70;
    }
    if(type!=="chaufferie"){
      if(+n.debit_lh>0) node.calc={mode:"debit", lh:+n.debit_lh};
      else if(+n.longueur_m>0) node.calc={mode:"deperdition", longueur:+n.longueur_m, wparm:+n.w_par_m>0?+n.w_par_m:10, dtBoucle:5};
      else if(+n.puissance_kw>0) node.calc={mode:"puissance", kW:+n.puissance_kw, dt:+n.dt>0?+n.dt:20};
      const v=VALVES.find(x=>x.id===n.vanne);
      if(v){
        const dn = v.dn.includes(+n.dn)? +n.dn : v.dn[Math.min(1,v.dn.length-1)];
        node.valve={id:v.id, dn:dn, pos:null};
      }
    }
    map[n.ref]=node; P.nodes.push(node);
  });
  /* 2e passage : liens de parenté, avec garde-fou anti-boucle */
  (plan.noeuds||[]).forEach(n=>{
    const node=map[n.ref];
    if(!node) return;
    if(!n.parent){ if(node.type!=="chaufferie") node.orphelin=true; return; }
    const par=map[n.parent];
    if(!par || par===node){ node.orphelin=true; return; }
    let a=par, garde=0;
    while(a && garde++<50){ if(a===node){ node.orphelin=true; return; } a = a.parent? P.nodes.find(x=>x.id===a.parent) : null; }
    node.parent=par.id;
  });
  /* aucune racine : on en fabrique une */
  if(!P.nodes.some(n=>!n.parent && n.type==="chaufferie")){
    const ch={id:uid(), parent:null, type:"chaufferie", nom:"Chaufferie", open:true};
    P.nodes.unshift(ch);
  }
  /* les éléments dont le parent était inconnu sont rattachés à la première chaufferie
     plutôt que laissés en vrac à la racine : l'arbre reste lisible et équilibrable */
  const racine=P.nodes.find(n=>!n.parent && n.type==="chaufferie");
  P.nodes.forEach(n=>{ if(n!==racine && (n.orphelin || (!n.parent && n.type!=="chaufferie"))) n.parent=racine.id; delete n.orphelin; });
  /* un débit donné explicitement par l'IA prime sur la somme des enfants : la liste
     des émetteurs est presque toujours incomplète après une simple visite filmée */
  P.nodes.forEach(n=>{ if(n.calc && enfants(n.id).length) n.forceDebit=true; });
  P.notes=[(P.notes||""),
    plan.hypotheses&&plan.hypotheses.length? "HYPOTHÈSES DE L'IA :\n- "+plan.hypotheses.join("\n- "):"",
    plan.reserves&&plan.reserves.length? "RÉSERVES À VÉRIFIER :\n- "+plan.reserves.join("\n- "):"",
    VIS.transcript? "COMMENTAIRE DE LA VISITE :\n"+VIS.transcript:""
  ].filter(Boolean).join("\n\n");
  P.visite={date:new Date().toISOString(), resume:VIS.synthese?VIS.synthese.resume:"",
            questions:VIS.questions.map(q=>({q:q.question, r:VIS.reponses[q.id]||""})),
            hypotheses:plan.hypotheses||[], reserves:plan.reserves||[]};
  autosave();
  flash("Chantier créé : "+P.nodes.length+" éléments");
  visInit();
  go("parcours");
}

    <div class="card">
      <h3>🎙️ Ce que vous avez dit</h3>
      ${VIS.transcript? `
        <p class="sub">Relisez et corrigez si nécessaire. Ce texte pèse autant que les images dans l'analyse.
          ${VIS.transcriptSource==="service"? '<span class="tag ok">transcription automatique</span>' : VIS.transcriptSource? '<span class="tag warn">reconnaissance du navigateur</span>':""}</p>
        <textarea id="visTr" style="min-height:130px;font-size:13px">${esc(VIS.transcript)}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn sm" id="visCor" ${VIS.busy?"disabled":""}>✨ Corriger le vocabulaire technique</button>
          ${VIS.transcriptBrut? '<button class="btn sm gho" id="visBrut">Revenir au texte brut</button>':""}
        </div>
        ${VIS.corrections&&VIS.corrections.length? '<div class="note g" style="margin-top:8px"><b>Corrections appliquées :</b><br>'+VIS.corrections.map(c=>esc(c.avant)+" → <b>"+esc(c.apres)+"</b>").join(" · ")+'<br><small>Si l\'une est fausse, corrigez-la directement dans le texte ci-dessus.</small></div>':""}`
        : '<div class="note">Aucun commentaire n\'a été capté. Écrivez ci-dessous ce que vous savez : <b>c\'est au moins aussi important que les images</b>.</div>'}
      <label class="f" style="margin-top:12px"><span>Ce que vous savez en plus (dictez avec le micro de votre clavier)</span>
        <textarea id="visNotes" style="min-height:110px" placeholder="Exemple : immeuble de 5 étages, 4 cages d'escalier. Les 2 derniers étages de la cage C sont froids depuis 2 ans. La chaudière est neuve. Il y a de l'eau chaude sanitaire bouclée. Personne n'a jamais équilibré.">${esc(VIS.notes)}</textarea></label>
      <div class="hint">Dites tout ce que vous savez, même en désordre : ce qui chauffe mal, le nombre d'étages et de colonnes, ce que le client vous a raconté, ce que vous avez déjà essayé.</div>
    </div>

    ${VIS.avertAudio? '<div class="note d">'+esc(VIS.avertAudio)+'</div>':""}
    ${VIS.erreur? '<div class="note d"><b>L\'analyse a échoué.</b><br>'+esc(VIS.erreur)+'</div>':""}

    <div class="card">
      <button class="btn pri wide" id="visAn" style="padding:16px;font-size:15px">🧠 ${VIS.synthese?"Relancer l'analyse":"Analyser avec l'IA"}</button>
      <div class="hint" style="margin-top:8px">L'analyse prend en général 30 secondes à 2 minutes selon le nombre d'images.</div>
      <button class="btn gho wide" id="visReset" style="margin-top:10px">Tout recommencer</button>
    </div>`;
    visBindStrip();
    $("#visNotes").oninput=e=>{ VIS.notes=e.target.value; };
    if($("#visTr")) $("#visTr").oninput=e=>{ VIS.transcript=e.target.value; };
    if($("#visCor")) $("#visCor").onclick=()=>visCorriger(false);
    if($("#visBrut")) $("#visBrut").onclick=()=>{ VIS.transcript=VIS.transcriptBrut; VIS.corrections=[]; delete VIS.transcriptBrut; vVisite(); };
    $("#visAn").onclick=()=>visPipeline();
    $("#visRefilm").onclick=visDemarrer;
    $("#visPlus").onclick=()=>visFichier("image/*", async fs=>{ await visImportPhotos(fs); vVisite(); }, true);
    $("#visReset").onclick=()=>{ if(confirm("Effacer la visite en cours ?")){ visInit(); vVisite(); } };
    return;
  }

  /* ---------- EN COURS ---------- */
  if(P_==="analyse" || P_==="generation"){
    el.innerHTML=`
    <div class="card" style="text-align:center;padding:40px 18px">
      <div style="font-size:42px;margin-bottom:14px">🧠</div>
      <h2 style="justify-content:center">${P_==="analyse"?"L'IA analyse votre visite":"L'IA construit votre chantier"}</h2>
      <p class="sub" style="margin-top:8px">${esc(VIS.etape||"…")}</p>
      <div class="bar" style="margin-top:16px"><i style="width:${Math.round((VIS.progres||0)*100)}%;background:var(--amber)"></i></div>
      <div style="margin-top:20px;text-align:left;max-width:330px;margin-left:auto;margin-right:auto">
        ${[["Transcription de votre commentaire",0.30],["Correction du vocabulaire technique",0.35],
           ["Lecture des images",0.95],["Synthèse et questions",1]].map(([t,seuil])=>
          `<div style="display:flex;gap:9px;align-items:center;padding:5px 0;font-size:12.5px;color:${(VIS.progres||0)>=seuil?"var(--muted)":"var(--txt)"}">
             <span style="width:16px">${(VIS.progres||0)>=seuil?"✓":"·"}</span><span>${t}</span></div>`).join("")}
      </div>
      <div class="hint" style="margin-top:14px">Ne fermez pas cette page. Le son et les images partent par petits lots pour éviter les coupures.</div>
    </div>`;
    return;
  }

  /* ---------- SYNTHÈSE ---------- */
  if(P_==="synthese"){
    const s=VIS.synthese||{};
    el.innerHTML=`
    <div class="card">
      <h2>👁️ Ce que l'IA a compris</h2>
      <p class="sub">Lisez et corrigez si c'est faux : tout le reste en dépend.</p>
      <div class="note i">${esc(s.resume||"—")}</div>
      ${s.type_installation? '<div class="row" style="margin-top:10px"><span class="tag amber">'+esc(s.type_installation)+'</span></div>':""}
    </div>
    ${VIS.avertAudio? '<div class="note d">'+esc(VIS.avertAudio)+(VIS.transcript?" L'analyse s'est appuyée sur ce que le navigateur avait entendu.":" L'analyse s'est appuyée uniquement sur les images.")+'</div>':""}
    ${VIS.transcript? `<div class="card">
      <div class="spread"><h3 style="margin:0">🎙️ Ce que l'IA a entendu</h3>
        <span class="tag ${VIS.transcriptSource==="service"?"ok":"warn"}">${VIS.transcriptSource==="service"?"transcription automatique":"reconnaissance du navigateur"}</span></div>
      <div class="live" style="max-height:160px;margin-top:10px">${esc(VIS.transcript)}</div>
      <button class="btn sm" style="margin-top:10px" id="visFix">✎ Corriger ce que j'ai dit et relancer l'analyse</button>
      <div class="hint" style="margin-top:6px">Une erreur dans ce texte se propage à tout le chantier : si un nom de vanne ou un nombre est faux, corrigez-le maintenant.</div>
    </div>`:""}
    ${(s.alertes&&s.alertes.length)? '<div class="card"><h3>⚠️ Points à traiter en priorité</h3><ul class="bul">'+s.alertes.map(a=>"<li>"+esc(a)+"</li>").join("")+'</ul></div>':""}
    ${(s.materiel_identifie&&s.materiel_identifie.length)? `<div class="card">
      <h3>Matériel identifié</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Quoi</th><th>Détail</th><th>Fiabilité</th></tr></thead><tbody>
      ${s.materiel_identifie.map(m=>`<tr><td>${esc(m.quoi)}</td><td style="font-size:11.5px;color:var(--muted)">${esc(m.detail||"")}</td>
        <td>${m.confiance==="sure"?'<span class="tag ok">vu</span>':m.confiance==="probable"?'<span class="tag warn">probable</span>':'<span class="tag bad">à vérifier</span>'}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="hint" style="margin-top:8px">« probable » ou « à vérifier » = <b>allez lire le marquage sur place</b> avant de vous en servir.</div>
    </div>`:""}
    <div class="card">
      <button class="btn pri wide" id="visQ" style="padding:15px">Répondre aux ${VIS.questions.length} questions →</button>
      <button class="btn gho wide" id="visBack" style="margin-top:10px">← Revenir aux images</button>
    </div>`;
    $("#visQ").onclick=()=>{ VIS.phase="questions"; VIS.qIdx=0; vVisite(); };
    $("#visBack").onclick=()=>{ VIS.phase="review"; vVisite(); };
    if($("#visFix")) $("#visFix").onclick=()=>{ VIS.phase="review"; vVisite(); };
    return;
  }

  /* ---------- QUESTIONS ---------- */
  if(P_==="questions"){
    const q=VIS.questions[VIS.qIdx];
    if(!q){ VIS.phase="synthese"; vVisite(); return; }
    const rep=VIS.reponses[q.id];
    el.innerHTML=`
    <div class="steps" style="margin-bottom:14px">${VIS.questions.map((x,i)=>
      `<div class="stepdot ${i<VIS.qIdx?"done":i===VIS.qIdx?"cur":""}"></div>`).join("")}</div>
    <div class="qbox">
      <div class="qprog">Question ${VIS.qIdx+1} sur ${VIS.questions.length}</div>
      <h3>${esc(q.question)}</h3>
      <div class="qwhy">${esc(q.pourquoi||"")}</div>
      ${q.type==="choix"&&q.options&&q.options.length?
        q.options.map((o,i)=>`<button class="qopt${rep===o?" on":""}" data-opt="${i}">${esc(o)}</button>`).join("")
      : q.type==="nombre"?
        `<label class="f"><span>Votre réponse${q.unite?" ("+esc(q.unite)+")":""}</span>
         <input type="number" step="any" id="qrep" value="${rep!=null?esc(rep):(q.defaut||"")}" style="font-size:19px;padding:14px"></label>`
      : `<label class="f"><span>Votre réponse</span>
         <textarea id="qrep" style="min-height:90px;font-size:15px">${rep!=null?esc(rep):esc(q.defaut||"")}</textarea></label>`}
      <button class="qopt" id="qsais" style="border-style:dashed;color:var(--muted)">🤷 Je ne sais pas</button>
    </div>
    ${q.aide? '<details><summary>💡 Où trouver la réponse ?</summary><div class="dbody">'+esc(q.aide)+'</div></details>':""}
    <div class="row" style="margin-top:14px">
      <button class="btn" id="qprev" style="flex:0 0 90px" ${VIS.qIdx===0?"disabled":""}>← Retour</button>
      <button class="btn pri" id="qnext" style="flex:1">${VIS.qIdx===VIS.questions.length-1?"Terminer et construire le chantier":"Suivant →"}</button>
    </div>
    ${VIS.erreur? '<div class="note d" style="margin-top:12px">'+esc(VIS.erreur)+'</div>':""}
    <div class="card tight" style="margin-top:14px">
      <button class="btn sm gho wide" id="qtout">Voir toutes les questions</button>
    </div>`;
    $$("[data-opt]",el).forEach(b=>b.onclick=()=>{
      VIS.reponses[q.id]=q.options[+b.dataset.opt];
      if(VIS.qIdx<VIS.questions.length-1){ VIS.qIdx++; vVisite(); } else vVisite();
    });
    $("#qsais").onclick=()=>{ VIS.reponses[q.id]="je ne sais pas";
      if(VIS.qIdx<VIS.questions.length-1){ VIS.qIdx++; vVisite(); } else vVisite(); };
    $("#qprev").onclick=()=>{ visSaisir(q); if(VIS.qIdx>0){ VIS.qIdx--; vVisite(); } };
    $("#qnext").onclick=()=>{ visSaisir(q);
      if(VIS.qIdx<VIS.questions.length-1){ VIS.qIdx++; vVisite(); } else visGenerer(); };
    $("#qtout").onclick=()=>{
      openModal(`<div class="modal-h"><h3>Toutes les questions</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>
      ${VIS.questions.map((x,i)=>`<button class="qopt" data-jump="${i}">
        <b>${i+1}. ${esc(x.question)}</b><br><small style="color:${VIS.reponses[x.id]?"#7fd398":"var(--faint)"}">${VIS.reponses[x.id]? "→ "+esc(VIS.reponses[x.id]) : "sans réponse"}</small></button>`).join("")}`);
      $$("[data-jump]").forEach(b=>b.onclick=()=>{ VIS.qIdx=+b.dataset.jump; closeModal(); vVisite(); });
    };
    return;
  }

  /* ---------- RÉSULTAT ---------- */
  if(P_==="resultat"){
    const pl=VIS.plan||{};
    const parType={};
    (pl.noeuds||[]).forEach(n=>{ parType[n.type]=(parType[n.type]||0)+1; });
    el.innerHTML=`
    <div class="card">
      <h2>🏗️ Votre chantier est prêt</h2>
      <p class="sub">Vérifiez que cela ressemble à ce que vous avez sur place, puis validez.</p>
      <div class="grid g3">
        ${Object.entries(parType).map(([t,n])=>`<div class="kpi"><div class="k">${esc(TYPES[t]?TYPES[t].nom:t)}</div><div class="v">${n}</div></div>`).join("")}
      </div>
    </div>
    <div class="card">
      <h3>Ce qui va être créé</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Élément</th><th>Type</th><th>Vanne</th><th class="num">Débit / puissance</th></tr></thead><tbody>
      ${(pl.noeuds||[]).map(n=>{
        const v=VALVES.find(x=>x.id===n.vanne);
        return `<tr><td>${esc(n.nom)}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(TYPES[n.type]?TYPES[n.type].nom:n.type)}</td>
        <td style="font-size:11px">${v? esc(v.marque+" "+v.modele)+(n.dn?" DN"+n.dn:""):'<span style="color:var(--faint)">—</span>'}</td>
        <td class="num mono">${n.debit_lh? Math.round(n.debit_lh)+" l/h" : n.puissance_kw? n.puissance_kw+" kW" : n.longueur_m? n.longueur_m+" m":"—"}</td></tr>`;}).join("")}
      </tbody></table></div>
    </div>
    ${(pl.hypotheses&&pl.hypotheses.length)? '<div class="card"><h3>⚠️ Ce que l\'IA a supposé</h3><p class="sub">À vérifier sur place : ces points ne viennent pas de vos images.</p><ul class="bul">'+pl.hypotheses.map(h=>"<li>"+esc(h)+"</li>").join("")+'</ul></div>':""}
    ${(pl.reserves&&pl.reserves.length)? '<div class="card"><h3>📋 À vérifier ou à mesurer</h3><ul class="bul">'+pl.reserves.map(h=>"<li>"+esc(h)+"</li>").join("")+'</ul></div>':""}
    ${pl.premiere_action? '<div class="note g"><b>Première action sur le chantier :</b><br>'+esc(pl.premiere_action)+'</div>':""}
    <div class="card">
      <button class="btn pri wide" id="visOk" style="padding:16px;font-size:15px">✓ Créer ce chantier</button>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="visRetourQ" style="flex:1">← Corriger mes réponses</button>
        <button class="btn" id="visRegen" style="flex:1">🔄 Refaire</button>
      </div>
      <div class="hint" style="margin-top:10px">Rien n'est définitif : tout reste modifiable ensuite dans l'onglet Réseau.</div>
    </div>`;
    $("#visOk").onclick=visAppliquer;
    $("#visRetourQ").onclick=()=>{ VIS.phase="questions"; VIS.qIdx=0; vVisite(); };
    $("#visRegen").onclick=visGenerer;
    return;
  }
}
function visSaisir(q){
  const e=$("#qrep");
  if(e && e.value!=="") VIS.reponses[q.id]=e.value;
}
function visFichier(accept, cb, multiple){
  const i=document.createElement("input");
  i.type="file"; i.accept=accept; if(multiple) i.multiple=true;
  i.onchange=()=>{ if(!i.files.length) return; cb(multiple? i.files : i.files[0]); };
  i.click();
}

   PARCOURS GUIDÉ — l'écran d'accueil du mode simple
   ------------------------------------------------------------------------- */
function vParcours(){
  const el=$("#v-parcours");
  const aP = !!P;
  const nNoeuds = aP? P.nodes.filter(n=>n.type!=="chaufferie").length : 0;
  const nDebits = aP? P.nodes.filter(n=>n.type!=="chaufferie" && debitNominal(n)>0).length : 0;
  const nVannes = aP? P.nodes.filter(n=>n.valve).length : 0;
  const nMes    = aP? P.nodes.filter(n=>derniereMesure(n)).length : 0;
  const chkOK   = aP? Object.values(P.checklist).filter(Boolean).length===CHECKLIST_AVANT.length : false;
  const gs      = aP? groupes() : [];
  const finis   = gs.filter(g=>etatGroupe(g).k==="done").length;

  const etapes=[
    {n:1, t:"Filmer l'installation", d:"Vous filmez, l'IA analyse et construit le chantier toute seule.",
     ok:aP && P.visite, dispo:true, go:()=>go("visite"),
     etat: aP&&P.visite? "Visite analysée" : "Pas encore fait",
     alt:"Ou créez le chantier à la main dans l'onglet Chantier."},
    {n:2, t:"Vérifier le chantier", d:"Le nom, le client, le fluide, votre appareil de mesure.",
     ok:aP && P.nom && P.operateur, dispo:aP, go:()=>go("projet"),
     etat: aP? (P.operateur? "Renseigné":"Opérateur manquant") : "Aucun chantier"},
    {n:3, t:"Vérifier les débits et les vannes", d:"Chaque point doit avoir un débit de consigne et un organe de réglage.",
     ok:aP && nNoeuds>0 && nDebits===nNoeuds && nVannes>0, dispo:aP && nNoeuds>0, go:()=>go("reseau"),
     etat: aP? nDebits+" / "+nNoeuds+" débits · "+nVannes+" vannes" : "—"},
    {n:4, t:"Faire les contrôles avant de commencer", d:"Purge, filtres, pompe figée, robinets thermostatiques. Sans cela, rien n'est fiable.",
     ok:chkOK, dispo:aP, go:()=>{ go("projet"); setTimeout(()=>{ const c=$("#chkList"); if(c) c.scrollIntoView({behavior:"smooth"}); },200); },
     etat: aP? Object.values(P.checklist).filter(Boolean).length+" / "+CHECKLIST_AVANT.length+" contrôles":"—"},
    {n:5, t:"Équilibrer, guidé pas à pas", d:"L'application vous dit quelle vanne régler, dans quel ordre, et jusqu'où.",
     ok:gs.length>0 && finis===gs.length, dispo:aP && nVannes>0, go:()=>go("equilibrage"),
     etat: gs.length? finis+" / "+gs.length+" groupes équilibrés" : "Aucun groupe"},
    {n:6, t:"Éditer le rapport", d:"Le procès-verbal d'équilibrage, à imprimer ou à envoyer au client.",
     ok:nMes>0, dispo:aP && nMes>0, go:()=>go("rapport"),
     etat: nMes? nMes+" points relevés" : "Aucune mesure"}
  ];
  const courante = etapes.find(e=>!e.ok && e.dispo) || etapes.find(e=>!e.ok) || etapes[etapes.length-1];

  el.innerHTML=`
  <div class="card">
    <h2>🚦 Votre parcours</h2>
    <p class="sub">${aP? "Chantier en cours : <b>"+esc(P.nom)+"</b>. Suivez les étapes dans l'ordre, l'application vous guide." : "Commencez par filmer votre installation : c'est le plus rapide et le plus sûr."}</p>
  </div>

  <div class="parc">
    ${etapes.map(e=>`<button class="pcard ${e.ok?"done":""} ${e===courante&&!e.ok?"now":""} ${!e.dispo&&!e.ok?"lock":""}" data-e="${e.n}" ${!e.dispo&&!e.ok?"disabled":""}>
      <div class="pnum">${e.ok?"✓":e.n}</div>
      <div class="pbody"><b>${esc(e.t)}</b><span>${esc(e.d)}</span><em>${esc(e.etat)}</em></div>
    </button>`).join("")}
  </div>

  <div class="card" style="margin-top:14px">
    <h3>Besoin d'aide ?</h3>
    <div class="row">
      <button class="btn sm" id="pcIA">✨ Demander à l'IA quoi faire maintenant</button>
      <button class="btn sm" id="pcAide">📚 Comprendre l'équilibrage</button>
    </div>
    ${!aP? '<button class="btn gho wide" style="margin-top:10px" id="pcNew">Créer un chantier vide (sans filmer)</button>':""}
  </div>

  ${aP? `<div class="card">
    <div class="spread"><div><b style="font-size:13px">${esc(P.nom)}</b>
      <div style="font-size:11.5px;color:var(--faint)">${esc(P.client||"")} ${P.client?"·":""} ${esc(P.date)} · ${P.nodes.length} éléments</div></div>
      <button class="btn xs" id="pcMenu">⋯</button></div>
  </div>`:""}`;

  $$("[data-e]",el).forEach(b=>b.onclick=()=>{ const e=etapes.find(x=>x.n===+b.dataset.e); if(e&&e.dispo!==false) e.go(); });
  $("#pcIA").onclick=()=>aiDemander(aP? "Regarde où j'en suis sur ce chantier et dis-moi exactement quoi faire maintenant, étape par étape."
                                      : "Je démarre un chantier d'équilibrage et je débute. Explique-moi par quoi commencer.", "execution");
  $("#pcAide").onclick=()=>go("aide");
  if($("#pcNew")) $("#pcNew").onclick=()=>{ nouveauProjet(); go("projet"); };
  if($("#pcMenu")) $("#pcMenu").onclick=()=>$("#btnMenu").click();
}

  $("#mExp").onclick=()=>{ if(P){exportJSON();closeModal();} else flash("Aucun chantier ouvert",true); };
  $("#mImp").onclick=()=>{ closeModal(); importJSON(); };
  $("#mPrint").onclick=()=>{ closeModal(); if(P){go("rapport"); setTimeout(()=>window.print(),300);} };
  $("#mHelp").onclick=()=>{ closeModal(); setTimeout(bienvenue,150); };
  $("#mReset").onclick=()=>{ if(confirm("Effacer TOUS les chantiers et tous les abaques enregistrés ? Cette action est irréversible.")){ localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_CHART); DB={projets:[],courant:null}; CHARTS={}; P=null; closeModal(); go("projet"); } };
};

/* modèles de réseau */
function modele(t){
  if(!P) return;
  const ch = racines()[0] || ajouterNoeud(null,"chaufferie","Chaufferie principale");
  if(t==="collectif"){
    const r=ajouterNoeud(ch.id,"reseau","Chauffage radiateurs"); r.mode="radiateurs"; r.dtNom=20; r.tDep=70;
    for(let i=1;i<=4;i++){ const c=ajouterNoeud(r.id,"colonne","Colonne "+i);
      for(let j=1;j<=5;j++){ const e=ajouterNoeud(c.id,"terminal","Rad "+i+"."+j); e.calc={mode:"puissance",kW:1.2,dt:20}; } }
  }
  if(t==="ecs"){
    const r=ajouterNoeud(ch.id,"reseau","Boucle ECS"); r.mode="ecs"; r.dtNom=5; r.tDep=55;
    for(let i=1;i<=5;i++){ const c=ajouterNoeud(r.id,"colonne","Colonne ECS "+i);
      c.calc={mode:"deperdition",longueur:60,wparm:10,dtBoucle:5}; c.forceDebit=true; }
  }
  if(t==="tertiaire"){
    const r=ajouterNoeud(ch.id,"reseau","Réseau tertiaire"); r.mode="ventilo"; r.dtNom=15; r.tDep=60;
    const b=ajouterNoeud(r.id,"batiment","Bâtiment A");
    const cta=ajouterNoeud(b.id,"colonne","Batteries CTA");
    for(let i=1;i<=2;i++){ const e=ajouterNoeud(cta.id,"terminal","CTA "+i); e.calc={mode:"puissance",kW:30,dt:15}; }
    const vc=ajouterNoeud(b.id,"colonne","Ventilo-convecteurs niveau 1");
    for(let i=1;i<=8;i++){ const e=ajouterNoeud(vc.id,"terminal","VC 1."+i); e.calc={mode:"puissance",kW:2.5,dt:15}; }
  }
  if(t==="indus"){
    const r=ajouterNoeud(ch.id,"reseau","Primaire process"); r.mode="process"; r.dtNom=25; r.tDep=90;
    for(let i=1;i<=3;i++){ const b=ajouterNoeud(r.id,"batiment","Sous-station "+i);
      for(let j=1;j<=3;j++){ const e=ajouterNoeud(b.id,"terminal","Échangeur "+i+"."+j); e.calc={mode:"puissance",kW:120,dt:25}; } }
  }
  autosave(); render(); flash("Modèle créé");
}

/* démarrage */
load();
renderTabs();
VIEW = modeSimple()? "parcours" : (P? "reseau" : "projet");
go(VIEW);
if(!localStorage.getItem("equilibrage_vu")){ localStorage.setItem("equilibrage_vu","1"); setTimeout(bienvenue, 400); }
window.addEventListener("beforeunload",autosave);
setInterval(autosave, 20000);
window.closeModal=closeModal;
